<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Winterphönix">
<meta name="theme-color" content="#120c1c">
<link rel="manifest" href="app.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Die Reise zum Winterphönix</title>
<!-- {{BUILDINFO}} -->
<style>
html,body{margin:0;height:100%;background:#120c1c;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{position:fixed;inset:0;box-sizing:border-box;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
 display:grid;grid-template-columns:1fr auto 1fr;align-items:center;font-family:"Avenir Next",system-ui,-apple-system,sans-serif}
#left,#right{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6vh;box-sizing:border-box;position:relative}
#right{justify-content:space-between;padding-top:10px}
#screen{display:flex;align-items:center;justify-content:center}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:6px;box-shadow:0 0 0 3px #3a2c40,0 8px 24px #000a}
#dpad{position:relative;width:162px;height:162px;flex:none}
#dpad .bar{position:absolute;background:#3c3248;border-radius:12px;box-shadow:inset 0 -4px 0 #0006}
#dpad .h{left:0;top:54px;width:162px;height:54px}#dpad .v{left:54px;top:0;width:54px;height:162px}
#dpad .ar{position:absolute;width:0;height:0;border:10px solid transparent;opacity:.75}
#dpad .au{left:71px;top:10px;border-bottom:13px solid #c8b8d8;border-top:0}
#dpad .ad{left:71px;bottom:10px;border-top:13px solid #c8b8d8;border-bottom:0}
#dpad .al{top:71px;left:10px;border-right:13px solid #c8b8d8;border-left:0}
#dpad .arr{top:71px;right:10px;border-left:13px solid #c8b8d8;border-right:0}
#dpad .on{opacity:1;filter:brightness(1.6)}
#ab{position:relative;width:170px;height:162px;flex:none}
.btn{position:absolute;width:78px;height:78px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 26px system-ui,sans-serif;color:#fff;box-shadow:inset 0 -5px 0 #0005,0 3px 8px #0006}
.btn small{font-size:10px;font-weight:600;opacity:.85;margin-top:-2px}
#bA{right:4px;top:8px;background:#c0763a}#bB{left:6px;bottom:8px;background:#4f6b2a}
.btn.on{filter:brightness(1.35);transform:translateY(2px)}
#tools{display:flex;flex-direction:column;align-items:center;gap:8px}
.tool{font:600 14px system-ui,sans-serif;color:#f4ead8;background:#3a2c40;border-radius:12px;padding:8px 14px;min-width:96px;text-align:center;box-shadow:inset 0 -3px 0 #0005}
.tool.on{filter:brightness(1.4)}
#snd.off{opacity:.55}
#hint{position:absolute;top:110px;right:8px;width:180px;font:500 12px system-ui,sans-serif;color:#f4ead8;background:#2a1e30ee;border:1px solid #e09a2c;border-radius:10px;padding:8px;opacity:0;transition:opacity .4s;pointer-events:none}
#hint.show{opacity:1}
body.hoch{grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;align-items:start}
body.hoch #screen{grid-column:1/3;grid-row:1;padding-top:8px}
body.hoch #left{grid-column:1;grid-row:2;justify-content:center;padding-bottom:0}
body.hoch #right{grid-column:2;grid-row:2;justify-content:center;padding:0}
body.hoch #tools{position:absolute;top:8px;right:8px;flex-direction:row}
#panel{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:10;touch-action:auto}
#panel .box{background:#24182c;border:2px solid #e09a2c;border-radius:12px;padding:18px;width:min(560px,90vw);color:#f4ead8;font:500 15px "Avenir Next",system-ui,sans-serif;-webkit-user-select:text;user-select:text}
#panel h2{margin:0 0 8px;font:700 20px Georgia,serif;color:#ffd36a}
#panel p{margin:0 0 10px;line-height:1.4}
#panel .msg{color:#ffd36a;min-height:1.2em}
#panel textarea{width:100%;box-sizing:border-box;height:110px;font:12px ui-monospace,Menlo,monospace;background:#120c1c;color:#f4ead8;border:1px solid #6a5a70;border-radius:8px;padding:8px;word-break:break-all}
#panel .row{display:flex;gap:10px;justify-content:flex-end}
#panel button{font:600 15px system-ui,sans-serif;padding:10px 18px;border-radius:10px;border:0;background:#3a2c40;color:#f4ead8}
#panel button.main{background:#c0763a}
</style>
</head>
<body>
<div id="left">
 <div id="dpad"><div class="bar h"></div><div class="bar v"></div>
  <div class="ar au" data-d="up"></div><div class="ar ad" data-d="down"></div><div class="ar al" data-d="left"></div><div class="ar arr" data-d="right"></div></div>
</div>
<div id="screen"><canvas id="c" width="512" height="384"></canvas></div>
<div id="right">
 <div id="tools"><div class="tool" id="bMenu" role="button" aria-label="Menü">☰ Menü</div><div class="tool" id="snd" role="button" aria-label="Ton an/aus">♪ Ton an</div></div>
 <div id="hint"></div>
 <div id="ab"><div class="btn" id="bA">A<small>sprechen</small></div><div class="btn" id="bB">B<small>schnüffeln</small></div></div>
</div>
<script>
/*__SCRIPT__*/
</script>
</body>
</html>
