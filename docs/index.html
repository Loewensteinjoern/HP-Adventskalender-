rite":"rotkehlchen","blasen":["Piep!","Tschilp!"],"talk":[{"dialog":"rotkehlchen"}]}},"dialogs":{"intro":[["","Løvestein, Ende November. Über dem Schloss fällt der erste richtige Schnee."],["","Im Gemeinschaftsraum des Hauses Bernfuchs knistert das Kaminfeuer."],["joern","Charly, schau mal raus! Bis morgen früh ist alles weiß."],["joern","Und Diego hat sich schon in sein Körbchen vor dem Kamin gerollt. Der weiß genau, wo es am gemütlichsten ist."],["","Steuerkreuz: laufen. A: sprechen und untersuchen. B: Diego schnüffeln lassen. ☰ oben rechts: Menü und Questlog."]],"q01_start":[["","1. Dezember. Über Nacht ist Løvestein unter einer dicken Schneedecke verschwunden."],["joern","Charly … riechst du das auch? Wie Glut und Schnee gleichzeitig."],["","Am Rand des Kamins glitzert Raureif. Mitten in der Wärme."],["joern","Das ist doch nicht normal. Vielleicht findet Diego heraus, was da los ist."]],"diego_wecken":[["","Diego schnarcht leise. Charly krault ihn hinter den Ohren."],["diego","Wuff?"],["","Diego streckt sich, gähnt ausgiebig – und weicht Charly ab jetzt nicht mehr von der Seite."],["","Tipp: Drück B, dann schnüffelt Diego nach Geheimnissen in der Nähe. Goldene Pfotenspuren zeigen den Weg."]],"diego_1":[["","Diego wedelt so heftig, dass sein ganzer Hintern mitwackelt."]],"diego_2":[["","Diego schaut dich an, als hätte er seit Stunden nichts gegessen. Hat er aber."]],"diego_3":[["diego","Wuff!"],["","Diego stupst dich mit der Nase an. Schnüffeln? (Taste B)"]],"diego_kein_geruch":[["","Diego schnüffelt eifrig am Boden … aber hier riecht nichts Besonderes."]],"diego_nicht_da":[["","Diego ist gerade nicht bei dir. Vielleicht schläft er noch im Körbchen am Kamin?"]],"joern_vor1":[["joern","Noch {tage} Tage, dann beginnt der Advent. Ich hab das Gefühl, dieses Jahr passiert hier etwas Besonderes."]],"joern_vor2":[["joern","Ich hab Frieda vorhin beim Laufrad-Marathon zugeschaut. Die ist fitter als ich."]],"joern_vor3":[["joern","Weißt du, was das Beste am Winter in Løvestein ist? Dass wir ihn zusammen erleben."]],"joern_1":[["joern","Wenn du mich brauchst: Ich bin direkt hinter dir. Wie immer."]],"joern_2":[["joern","Noch eine Tasse Kakao, und ich schlafe vor dem Kamin ein. Neben Diego."]],"joern_3":[["joern","Hörst du das? Das Schloss knarrt, als würde es sich im Schlaf umdrehen."]],"joern_q01_tipp":[["joern","Der Raureif am Kamin lässt mir keine Ruhe. Diego hat die beste Nase im ganzen Schloss – lass ihn mal schnüffeln."]],"q01_joern":[["joern","Eine Feder? Die ist ja … warm. Mitten im Winter."],["joern","Schau, sie glimmt wie Glut. So einen Vogel gibt es hier doch gar nicht."],["","An der Feder hängen feine Raureif-Kristalle. Sie glitzern in Richtung Tür."],["joern","Lotte Silberfeder weiß bestimmt, was das ist. Sie sitzt sicher wieder in der Großen Halle über ihren Büchern."]],"q01_joern_danach":[["joern","Die Raureif-Spur führt durch die Tür in den Kellergang und die Treppe hinauf. Komm, wir folgen ihr!"]],"q01_feder_fund":[["","Diego bellt den Kamin an. Hinter einem losen Ziegel steckt … eine Feder!"],["","Sie schimmert golden-weiß und fühlt sich warm an, obwohl ringsum Raureif glitzert."],["","Charly hat die Winterfeder gefunden."]],"geheim_zimtstern":[["","Hinter dem Farn liegt ein Zimtstern – noch ganz knusprig!"],["","Diego bekommt die Hälfte. Mindestens."]],"geheim_notiz":[["","Hinter einem losen Stein steckt ein vergilbter Zettel:"],["","„Wer das hier findet, hat einen sehr guten Hund. – Ein Schüler aus Bernfuchs, vor langer, langer Zeit.“"]],"pit_1":[["pit","Hey Charly! Ich lese gerade „Wintermagie für Anfänger“. Kapitel eins: Nie die Zunge an einen Eiszapfen halten."]],"pit_2":[["pit","Hast du das auch gemerkt? Seit heute Nacht flackern alle Kerzen im Schloss so komisch."]],"frieda":[["","Frieda rennt in ihrem Laufrad, als gäbe es kein Morgen."],["frieda","Piep!"],["","Sie stopft sich die Backen voll und schaut dich mit glänzenden Knopfaugen an."]],"kamin":[["","Das Feuer knistert. Es riecht nach Tannenzapfen und ein bisschen nach Zimt."]],"kamin_q01":[["","Am Rand des Kamins glitzert Raureif – direkt neben den Flammen. Diego könnte schnüffeln (Taste B)."]],"fenster":[["","Draußen tanzen dicke Schneeflocken. In der Ferne glitzert der Spiegelsee im Mondlicht."]],"regal_1":[["","„Hundert Arten, Tee zu kochen“, „Rätsel für lange Winterabende“ … und ganz hinten ein Buch, das leise summt."]],"regal_2":[["","„Moosgrün und Bernstein – Die Geschichte des Hauses Bernfuchs“. Auf dem Rücken klebt ein Hundehaar."]],"banner":[["","Das Banner des Hauses Bernfuchs: ein Fuchs auf Moosgrün und Bernstein. Darunter steht: „Treu und warm.“"]],"wanduhr":[["","Die Wanduhr tickt gemütlich. Ihr Pendel schwingt im Takt des Kaminfeuers."]],"tannenbaum":[["","Ein kleiner Tannenbaum mit Strohsternen. Jemand hat einen Hundekeks als Schmuck aufgehängt. Diego hat ihn schon im Blick."]],"sofa":[["","Das gemütlichste Sofa im ganzen Schloss. Leider ist Diego der gleichen Meinung."]],"tisch":[["","Ein Adventskranz aus Tannenzweigen. Daneben dampfen zwei Tassen Kakao – eine mit extra viel Sahne."]],"sessel":[["","Ein weicher Lesesessel. Die Delle im Polster hat genau Charlys Form."]],"lampe":[["","Die Stehlampe verbreitet warmes, honiggelbes Licht."]],"kommode":[["","In der Kommode: Wollsocken, Strickmützen und eine Dose Hundekekse. Diego sitzt sofort daneben."]],"buecher":[["","Ein wackeliger Bücherstapel. Ganz oben: „Pfotenkunde für Fortgeschrittene“."]],"pflanze":[["","Eine Zimmerpflanze. Sie hat sich zum Kamin gedreht, um es warm zu haben."]],"ottokar":[["ottokar","Chrrr … pfffh … chrrr …"],["","Sir Ottokar der Schnarcher schläft in seinem Goldrahmen. Wie immer."]],"ruestung":[["","Eine alte Ritterrüstung. Als Charly vorbeigeht, quietscht das Visier ganz leise."]],"bank":[["","Eine Holzbank. In die Lehne hat jemand einen kleinen Fuchs geschnitzt."]],"wandkerze":[["","Eine Kerze in einem eisernen Halter. Die Flamme neigt sich zur Treppe hin, als wehe von oben ein kalter Wind."]],"treppe_vor":[["","Die Treppe hinauf zum Schlosskern. Oben ist es noch still – ab dem 1. Dezember geht es hier weiter."]],"treppe_bald":[["","Ein kalter Luftzug weht von oben herab. Die Treppe ist noch zugeschneit. Hier geht es bald weiter."]],"q01_lotte":[["lotte","Charly! Was hast du denn da … Ist das etwa eine Feder?"],["lotte","Golden, warm und mit Raureif … Das hab ich schon mal gesehen. In einem ganz alten Buch über Winterwesen."],["lotte","Da stand: Wenn eine Winterfeder auftaucht, erwacht eine alte Legende. Die vom Winterphönix."],["joern","Ein Phönix? Im Winter? Ich dachte, die mögen es eher warm."],["lotte","Genau das ist ja das Rätsel. Ich suche heute Abend in der Bibliothek weiter. Pass gut auf die Feder auf!"],["","Als Charly die Feder hochhält, löst sich ein eisblauer Splitter aus dem Raureif …"]],"lotte_q01_frueh":[["lotte","Guten Morgen, Charly! Draußen liegt so viel Schnee, dass Knarz seit Sonnenaufgang schippt."]],"lotte_q02":[["lotte","Hörst du die Kerzen? Die singen so schief, dass mir die Ohren klingeln."],["lotte","Prof. Federleicht steht links neben dem Lehrertisch. Er weiß bestimmt Rat."]],"lotte_q03":[["lotte","Eine Eule ohne Gedächtnis? Frau Leisetritt in der Bibliothek kennt jede Feder und jeden Tintenfleck im Schloss. Frag sie mal."]],"lotte_q04":[["lotte","Die Turmuhr hat heute Nacht dreizehnmal geschlagen. Rückwärts! Prof. Pendel ist ganz außer sich."]],"lotte_1":[["lotte","Ich hab drei Bücher über Phönixe gefunden. In allen fehlt genau das Kapitel über den Winter. Merkwürdig, oder?"]],"lotte_2":[["lotte","Diego hat mir vorhin ein Lesezeichen geklaut. Ich glaube, er wollte nur helfen."]],"q02_start":[["","2. Dezember. Beim Frühstück in der Großen Halle singen die schwebenden Kerzen."],["","Leider schief. Sehr schief."],["joern","Das klingt wie ich unter der Dusche. Vielleicht weiß Prof. Federleicht, was los ist."]],"q02_federleicht":[["federleicht","Ah, Charly! Hörst du das? Meine Kerzen haben ihre Melodie vergessen."],["federleicht","Kerzen erinnern sich nur, wenn man sie in der richtigen Reihenfolge entzündet. Dafür brauchst du den Lichtzauber."],["federleicht","Hand locker, Blick zur Flamme – und dann sanft: „Luxa!“"],["","Ein warmes Licht tanzt über Charlys Finger. Sie hat den Zauber Luxa gelernt!"],["federleicht","Wunderbar! Die Spieluhr rechts neben dem Lehrertisch kennt die richtige Melodie. Hör gut hin – und schau, welche Kerze mitleuchtet."]],"federleicht_tipp":[["federleicht","Die Spieluhr spielt die Melodie, so oft du willst. Achte darauf, welche Kerze bei welchem Ton aufleuchtet."]],"federleicht_danke":[["federleicht","Hörst du das? Sie singen wieder richtig! Ein Hoch auf Charly und ihr feines Gehör."]],"federleicht_1":[["federleicht","Ich unterrichte Zauberkunst. Mein Lieblingszauber? Der, der Kakao warm hält."]],"spieluhr_q02":[["","Charly zieht die Spieluhr auf. Vier Töne erklingen – und bei jedem leuchtet eine der Kerzen auf."],["joern","Merk dir die Reihenfolge. Ich hab sie schon wieder vergessen."]],"spieluhr_danach":[["","Die Spieluhr spielt, und alle vier Kerzen singen mit. Diesmal klingt es wunderschön."]],"spieluhr":[["","Eine kleine Spieluhr aus Walnussholz. Sie spielt vier helle Töne."]],"kerze_ohne_luxa":[["","Die Kerze schwebt in der Luft und summt leise. Um sie anzuzünden, bräuchte man einen Lichtzauber."]],"kerzen_falsch":[["","Diego jault schief mit. Die Kerzen erlöschen mit einem beleidigten Zischen."],["","Noch einmal von vorn! Die Spieluhr hilft beim Erinnern."]],"q02_geschafft":[["","Die vierte Kerze flammt auf – und plötzlich singen alle vier zusammen, klar und warm."],["","In ihrem Licht glitzert etwas in der Luft: ein eisblauer Splitter schwebt herab."],["federleicht","Bravo, Charly! So schön haben sie seit Jahren nicht gesungen."]],"q03_start":[["","3. Dezember. Mitten in der Nacht klopft es ans Fenster des Gemeinschaftsraums."],["","Eine zerzauste Eule mit einer Briefkapsel am Bein flattert vorbei – und dann weiter Richtung Eulenturm."],["joern","Die sah aber verwirrt aus. Wollen wir nachsehen? Der Eulenturm liegt am Innenhof."]],"q03_eule":[["pimpernell","Schuhu? Wer … wer bist du? Und wer bin ich? Ach ja. Pimpernell. Glaube ich."],["pimpernell","Ich habe einen Brief. Einen wichtigen! Aber ich weiß nicht mehr, für wen. Oder von wem. Oder warum."],["pimpernell","Ich erinnere mich nur an drei Dinge: rotes Siegelwachs … ein rotes Band … und einen Tintenklecks."],["joern","Dann suchen wir diese drei Dinge. Vielleicht kommt die Erinnerung dann zurück."]],"pimpernell_warten":[["pimpernell","Siegelwachs, rotes Band, Tintenfass … Hast du schon alles? Ich hab vergessen, ob ich schon gefragt habe."]],"q03_erinnert":[["","Charly legt Siegelwachs, Band und Tintenfass vor Pimpernell."],["pimpernell","Schuhu! Jetzt weiß ich es wieder! Der Brief ist für … für dich, Charly! Für die, die die Winterfeder gefunden hat."],["pimpernell","Aber die Kapsel ist verschlossen. Ein alter Schlosszauber. Prof. Pendel kennt sich mit allem aus, was tickt und klickt."]],"pimpernell_kapsel":[["pimpernell","Die Kapsel klemmt. Prof. Pendel im Uhrenturm kennt sich mit Schlössern aus. Schuhu."]],"pimpernell_danke":[["pimpernell","Ich weiß noch alles! Fast alles. Na ja, das Wichtigste. Danke, Charly."]],"pimpernell_1":[["pimpernell","Schuhu? Kennen wir uns? Du kommst mir bekannt vor. Oder ist das der Hund?"]],"q03_siegel":[["","Diego kratzt an einer Mauerritze. Darin klebt ein Klumpen rotes Siegelwachs!"],["","Charly hat das Siegelwachs gefunden."]],"q03_band":[["","Charly pflückt das rote Band aus den verschneiten Zweigen. Es ist mit kleinen Federn bestickt."],["","Charly hat das rote Band gefunden."]],"q03_leisetritt":[["leisetritt","Psst! Ein Tintenfass für eine Eule? Ach, Pimpernell! Die schreibt seit Jahren mit genau diesem hier."],["leisetritt","Nimm es nur mit. Aber kein Klecks auf meine Bücher, verstanden?"],["","Charly hat das Tintenfass bekommen."]],"q03_pendel":[["pendel","Eine Briefkapsel mit Schlosszauber? Wie aufregend. Das ist ganz alte Handwerkskunst."],["pendel","Jedes Schloss hört auf einen Zauber: „Clavis.“ Man muss nur freundlich fragen. Schlösser sind empfindlich."],["","Charly hat den Zauber Clavis gelernt!"],["pendel","Probier es gleich bei Pimpernell aus. Aber Achtung: Wer den falschen Zauber erwischt, kitzelt die Kapsel nur."]],"q04_start":[["","4. Dezember. Heute Nacht hat die Turmuhr dreizehnmal geschlagen. Rückwärts."],["joern","Dreizehnmal? Und rückwärts? Das will ich sehen. Der Uhrenturm ist rechts vom Schlosskern."]],"q04_pendel":[["pendel","Charly! Hörst du das Ticken? Es tickt falsch herum! Ein Zahnrad fehlt – das große aus Messing."],["pendel","Bevor du es einsetzt, brauchst du den Reparaturzauber. „Restauro!“ Und dabei ganz ruhig an das Ganze denken."],["","Ein feines Klicken geht durch Charlys Fingerspitzen. Sie hat den Zauber Restauro gelernt!"],["pendel","Das Zahnrad kann nicht weit sein. Irgendjemand hat es versteckt … Vielleicht findet eine gute Nase die Spur."]],"pendel_tipp_zahnrad":[["pendel","Das Zahnrad riecht nach Öl und Messing. Ein Hund würde das sofort merken. Nur so ein Gedanke."]],"pendel_tipp_einsetzen":[["pendel","Du hast es! Setz es ins Uhrwerk in der Mitte ein. Und dann: Restauro!"]],"pendel_tipp_uhrmeister":[["pendel","Der Uhrmeister ist erwacht. Er prüft jeden, der an seiner Uhr arbeitet. Hör genau auf seinen Takt."]],"pendel_danke":[["pendel","Tick, tack, tick – in der richtigen Richtung! Ich könnte weinen vor Glück. Tu ich aber nicht. Fast nicht."]],"pendel_1":[["pendel","Ich bin Prof. Pendel, Zeitkunde. Wenn du irgendwann Zeit hast – das ist ein Witz für Fortgeschrittene."]],"q04_geheimgang":[["","Diego bellt eine Wand an. Ein Stein ist locker! Charly drückt dagegen …"],["","Mit lautem Knirschen schiebt sich der Stein zur Seite. Dahinter: ein geheimer Gang!"],["joern","Ein Geheimgang! Diego, du bist unbezahlbar."]],"q04_zahnrad_fund":[["","In der Nische liegt ein großes Zahnrad aus Messing. Es ist warm, als hätte es gerade noch getickt."],["","Charly hat das Zahnrad gefunden."]],"zahnrad":[["","Ein glänzendes Zahnrad aus Messing."]],"q04_einsetzen":[["","Charly setzt das Zahnrad ein. Die Räder greifen ineinander …"],["","Die Räder greifen ineinander, das Uhrwerk ruckt – und die Messingfigur neben der Uhr hebt langsam den Kopf."],["uhrmeister","TICK. TACK. WER. RÜHRT. MEINE. UHR. AN?"]],"uhrwerk_luecke":[["","Im Uhrwerk klafft eine Lücke. Hier fehlt eindeutig ein großes Zahnrad."]],"uhrwerk_kaputt":[["","Das Uhrwerk ruckelt und knarzt. Irgendetwas stimmt hier nicht."]],"uhrwerk_laeuft":[["","Die Zahnräder drehen sich ruhig und gleichmäßig. Tick, tack."]],"uhrmeister_erwacht":[["uhrmeister","NUR. WER. DIE. ZEIT. VERSTEHT. DARF. DIE. UHR. STELLEN."],["uhrmeister","DREI. FRAGEN. DREI. ANTWORTEN."],["","Lies die Frage, dreh den Zeiger mit dem Steuerkreuz auf die richtige Stunde und bestätige mit A."]],"uhrmeister_besiegt":[["uhrmeister","TAKT. GEHALTEN. DU. BIST. WÜRDIG."],["","Der Uhrmeister dreht die Zeiger mit einem Ruck in die richtige Richtung. Die Turmuhr schlägt – vorwärts."],["","Aus dem Zifferblatt rieselt ein eisblauer Splitter."]],"uhrmeister_ruhig":[["uhrmeister","TICK. TACK. ALLES. IN. ORDNUNG."]],"uhrmeister_still":[["","Eine Ritterfigur aus Messing. Sie steht ganz still, nur ihre Augen glimmen ein bisschen."]],"takt_abbruch":[["","Charly tritt einen Schritt zurück. Der Uhrmeister wartet geduldig. Sprich ihn an, wenn du es noch einmal versuchen willst."]],"knarz_auftrag":[["knarz","Grmpf. Hast du meinen Schlüsselbund gesehen? Groß, rostig, klimpert."],["knarz","Muss mir beim Schneeschippen im Innenhof aus der Tasche gefallen sein. Jetzt liegt er irgendwo unter dem Schnee."],["joern","Diego findet doch sonst auch jeden Keks. Vielleicht auch Schlüssel?"]],"knarz_warten":[["knarz","Ohne Schlüssel komm ich nicht mal an meine eigene Teekanne. Grmpf."]],"knarz_schluessel_fund":[["","Diego buddelt im Schnee wie ein Weltmeister – und zieht einen klimpernden Schlüsselbund heraus!"]],"knarz_danke":[["knarz","Mein Schlüsselbund! Grmpf … ich meine: Danke. Wirklich."],["knarz","Für dich und den Hund. Ein Lebkuchen. Den Hund erst später, ja?"],["","Diego hat den Lebkuchen trotzdem schon im Blick."]],"knarz_1":[["knarz","Schnee schippen, Kerzen putzen, Rüstungen polieren. Grmpf. Ich liebe diesen Job."]],"knarz_2":[["knarz","Wenn die Rüstungen nachts quietschen, ist das normal. Glaube ich."]],"sternwald_1":[["sternwald","Willkommen, Charly. Løvestein ist in diesem Winter … wacher als sonst. Halte die Augen offen."]],"sternwald_2":[["sternwald","Die Turmuhr schlägt wieder richtig. Ich habe gehört, wer dahintersteckt. Gut gemacht."]],"torbogen":[["","Ein Torbogen mit einer frischen Tannengirlande. Darüber das Wappen von Løvestein."]],"banner_bernfuchs":[["","Haus Bernfuchs: Moosgrün und Bernstein. „Treu und warm.“"]],"banner_eisvogel":[["","Haus Eisvogel: Türkis und Perlweiß. „Klar wie Wasser.“"]],"banner_tannenhirsch":[["","Haus Tannenhirsch: Tannengrün und Kupfer. „Mutig durch jeden Wald.“"]],"banner_sternbaer":[["","Haus Sternbär: Pflaume und Silber. „Geduld bringt Sterne.“"]],"saeule":[["","Eine Säule aus hellem Stein, umwickelt mit Tannengrün und einer roten Schleife."]],"ruestung2":[["","Diese Rüstung trägt einen Schal. Knarz behauptet, er war das nicht."]],"tannenbaum_gross":[["","Ein riesiger Tannenbaum mit roten Kugeln und hunderten Lichtern. Er duftet nach Wald und Zimt."]],"fenster_halle":[["","Hinter dem hohen Fenster wirbelt der Schnee. Im Glas spiegeln sich die schwebenden Kerzen."]],"lehrertisch":[["","Der Lehrertisch. Auf Prof. Federleichts Platz liegt ein Stapel Notenblätter."]],"tisch_bernfuchs":[["","Der Tisch des Hauses Bernfuchs. Hier gibt es immer den besten Apfelkuchen. Zufall? Sicher nicht."]],"tisch_eisvogel":[["","Der Tisch des Hauses Eisvogel. Lotte hat ein Buch neben ihren Teller gelegt. Natürlich."]],"tisch_tannenhirsch":[["","Der Tisch des Hauses Tannenhirsch. Jemand hat Tannenzapfen zu einer kleinen Burg gestapelt."]],"tisch_sternbaer":[["","Der Tisch des Hauses Sternbär. Die Servietten sind zu Sternen gefaltet."]],"regal_bib1":[["","„Die Kunst des leisen Umblätterns“ von O. Leisetritt. Signiert."]],"regal_bib2":[["","„Winterwesen und wo sie überwintern“. Das Kapitel über den Phönix wurde herausgerissen."]],"regal_bib3":[["","„Zahnräder, Zeiger und Zauber“. Jemand hat mit Bleistift „Pendel war hier“ hineingeschrieben."]],"regal_bib4":[["","Ganz oben steht ein Buch, das sich weigert, herausgenommen zu werden. Es brummt."]],"pult":[["","Frau Leisetritts Pult. Alles liegt exakt im rechten Winkel. Sogar die Krümel."]],"mauseloch":[["","Ein kleines Loch in der Wand. Es riecht nach Sonnenblumenkernen und altem Pergament."]],"globus":[["","Ein Globus mit Løvestein in der Mitte. Ganz im Norden ist ein kleiner Vogel eingraviert."]],"lesetisch":[["","Ein Lesetisch mit aufgeschlagenen Büchern und einer Kerze, die nie herunterbrennt."]],"leisetritt_1":[["leisetritt","Psssst! Hier wird geflüstert. Auch Hunde flüstern hier. Nicht wahr, Diego?"]],"leisetritt_2":[["leisetritt","Bücher kommen nach dem Lesen zurück ins Regal. Mit dem Rücken nach vorne. Immer."]],"laterne":[["","Eine Laterne mit Tannenzweig. Ihr Licht malt goldene Kreise in den Schnee."]],"brunnen":[["","Der Brunnen ist zugefroren. Im Eis glitzern Münzen von Wünschen aus vielen Wintern."]],"tanne":[["","Eine Tanne unter einer dicken Schneedecke. Ein Rotkehlchen guckt kurz heraus."]],"schneemann":[["","Ein Schneemann mit Bernfuchs-Schal. Pit behauptet, er sähe ihm ähnlich."]],"baum_band":[["","In den kahlen Zweigen flattert ein rotes Band."]],"baum_kahl":[["","Ein kahler Baum voller Schneehäubchen."]],"fenster_eule":[["","Vom Eulenturm aus sieht man weit über den verschneiten Raunwald."]],"stange":[["","Auf der Stange sitzen Schuleulen. Eine zwinkert, eine schläft, eine tut beides gleichzeitig."]],"stange_leer":[["","Eine leere Sitzstange. Hier sitzt wohl Pimpernell – wenn sie sich daran erinnert."]],"zifferblatt":[["","Das große Zifferblatt von innen. Die Zeiger laufen … rückwärts."]],"zifferblatt_ok":[["","Das große Zifferblatt. Die Zeiger laufen wieder vorwärts. Tick, tack."]],"werkbank":[["","Prof. Pendels Werkbank: Schräubchen, Federn, ein halbes Butterbrot."]],"loser_stein":[["","Eine Steinwand. Einer der Steine sitzt ein bisschen schief."]],"mats_1":[["mats","Hey Charly! Nach dem Abendessen: Schneeballschlacht im Innenhof. Tannenhirsch gegen Bernfuchs!"]],"mats_2":[["mats","Ich hab gehört, im Uhrenturm gibt es einen Geheimgang. Quatsch, oder?"]],"oskar_1":[["oskar","Unser Schneemann braucht noch eine Nase. Hast du zufällig eine Karotte dabei?"]],"oskar_2":[["oskar","Ich hab einen Handschuh verloren. Wenn Diego ihn findet, darf er ihn behalten. Fast."]],"juna_1":[["juna","Die Sterne stehen diesen Winter ganz eigenartig. Prof. Nachtfalter ist ganz aufgeregt."]],"juna_2":[["juna","Ich schreibe meiner Oma einen Brief. Hoffentlich findet die Eule den Weg."]],"ida_1":[["ida","Psst … Lotte und ich machen ein Wettlesen. Ich bin bei Buch vierzehn."]],"ida_2":[["ida","Weißt du, dass in dieser Bibliothek ein Buch über Phönixe fehlt? Einfach weg!"]],"finn_1":[["finn","Hast du die Zimtsterne am Buffet probiert? Ich hab schon sieben. Glaube ich."]],"finn_2":[["finn","Diego darf bestimmt auch einen Keks. Oder zwei. Ich sag’s keinem."]],"kater_1":[["kater","Miau."],["","Kater Zimt streicht um Charlys Beine und ignoriert Diego mit großer Würde."]],"kater_2":[["","Kater Zimt rollt sich auf den Rücken. Eine Falle. Jeder weiß das."]],"rotkehlchen":[["","Ein Rotkehlchen hüpft durch den Schnee und schaut Charly neugierig an."]],"statue_eule":[["","Eine steinerne Eule mit Stechpalmenkranz. Ihre Augen scheinen Charly zu folgen."]],"statue_fuchs":[["","Ein steinerner Fuchs mit buschigem Schwanz – das Wappentier von Bernfuchs."]],"statue_ritter":[["","Ein steinerner Ritter. Jemand hat ihm eine Zipfelmütze aufgesetzt."]],"buffet":[["","Das Weihnachtsbuffet: Lebkuchen, Zimtsterne, Bratäpfel und eine dampfende Schüssel Apfelpunsch."],["joern","Nur einen. Na gut, zwei."]],"kamin_halle":[["","Ein großer Kamin. Das Feuer knistert, und die Wärme reicht bis zu den Tischen."]],"zauber_keine":[["","Charly kennt noch keinen Zauber, der hier helfen könnte."]],"q03_kapsel_offen":[["","Klick! Die Briefkapsel springt auf."],["","Im Brief steht in altmodischer Schrift: „Wer die Feder findet, trage die Botschaft weiter. Der Winter erinnert sich.“"],["pimpernell","Schuhu! Ich wusste, dass es wichtig war. Ich weiß nur nicht mehr, warum."]],"bild_schiff":[["","Ein Segelschiff im Eismeer. Auf dem Mast sitzt ein kleiner goldener Vogel."]],"bild_herr":[["","Ein ernster Herr mit Bart. Als Charly vorbeigeht, zwinkert er. Ganz sicher."]],"bild_dame":[["","Eine Dame mit Perlenkette. Sie hält einen Fächer aus Federn – golden und weiß."]],"bild_obst":[["","Ein Gemälde mit Äpfeln und Birnen. Diego schaut es hungrig an."]],"schiessscharte":[["","Durch den schmalen Schlitz pfeift kalter Wind. Draußen tanzt der Schnee."]],"wegweiser_turm":[["","↑ Uhrenturm   ← Schlosskern. Darunter hat jemand gekritzelt: „Nicht schwindelig werden!“"]],"wegweiser_eule":[["","↑ Eulenturm. Bitte leise – Eulen schlafen tagsüber. Meistens."]],"garderobe":[["","Mäntel und Schals in allen Hausfarben. Darunter stehen Stiefel voller Schnee."]],"schneehaufen":[["","Ein Schneehaufen. Diego möchte unbedingt hineinspringen."]],"mats_pixie":[["mats","Charly! Da hinten im tiefen Schnee, beim Brunnen – der Schneehaufen hat gekichert! Ich schwör’s!"],["mats","Seit heute Nacht ist es da draußen irgendwie … frostiger. Pass auf dich auf."]],"probe_start":[["","Der Schneehaufen zittert. Diego stellt das Fell auf und knurrt leise."],["diego","Grrrrr …"],["","Mit einem Kichern springt etwas Kleines, Glitzerndes heraus: eine Schneepixie!"],["joern","Keine Angst, Charly – wir sind zu dritt. Du zauberst, ich halte dich warm, und Diego hilft auch mit."]],"probe_sieg":[["joern","Das war großartig! Hast du gemerkt? Licht mögen die gar nicht."],["joern","Im tiefen Schnee am Rand lauern bestimmt noch mehr davon. Wenn dir kalt wird: einfach zurück ins Warme, da wärmst du dich sofort auf."],["","Charly kann jetzt kämpfen. Im tiefen Schnee kann es plötzlich losgehen – Diego warnt vorher mit einem Knurren."]],"kampf_tutorial":[["joern","So geht’s: Du wählst in jeder Runde eine Sache – für dich, für mich oder für Diego."],["joern","Jeder Gegner hat eine Schwäche. Lass Diego schnüffeln, dann weißt du, welcher Zauber am besten wirkt."],["joern","Und wenn dir kalt wird: Ich hab heißen Kakao dabei."]],"kampf_aufwachen":[["","Alles wird still und kalt …"],["","Als Charly die Augen öffnet, ist es wieder warm. Jörn hat ihr eine Decke umgelegt und reicht ihr einen Becher Kakao."],["joern","Da bist du ja wieder. Wir versuchen es gleich nochmal – ganz in Ruhe."]],"glut_fund":[["","Diego scharrt im Schnee. Darunter glimmt etwas: ein winziger, warmer Glutsplitter!"],["","Charly steckt ihn ein. Drei Glutsplitter machen sie spürbar wärmer."]],"diego_knurrt":[["diego","Grrrr …!"]]},"quests":{"Q01":{"day":1,"title":"Die letzte Winterfeder","start":"q01_start","fragment":"Wenn die längste Nacht sich naht, sucht der Phönix sein Feuer.","steps":[{"flag":"diego_dabei","text":"Weck Diego in seinem Körbchen am Kamin."},{"flag":"q01_feder","text":"Am Kamin glitzert Raureif. Lass Diego schnüffeln (Taste B)."},{"flag":"q01_joern","text":"Zeig Jörn die Feder."},{"flag":"q01_lotte","text":"Folge der Raureif-Spur über den Kellergang und den Schlosskern in die Große Halle und frag Lotte Silberfeder."}]},"Q02":{"day":2,"title":"Die singenden Kerzen","start":"q02_start","fragment":"Sein Lied weckt das Licht in allen Kerzen.","steps":[{"flag":"zauber_luxa","text":"Lass dir von Prof. Federleicht in der Großen Halle den Lichtzauber zeigen."},{"flag":"q02_melodie","text":"Hör dir die Spieluhr rechts neben dem Lehrertisch an. Achte darauf, welche Kerze mitleuchtet."},{"flag":"q02_kerzen","text":"Zünde die vier singenden Kerzen in der Reihenfolge der Melodie an: vor die Kerze stellen, A, den richtigen Zauber wählen."}]},"Q03":{"day":3,"title":"Die Eule ohne Erinnerung","start":"q03_start","fragment":"Eulen trugen einst seine Botschaften über das Land.","steps":[{"flag":"q03_eule","text":"Besuch die verwirrte Eule im Eulenturm. Der Weg führt über den Innenhof."},{"flags":["q03_siegel","q03_band","q03_tinte"],"text":"Finde Pimpernells drei Erinnerungsstücke ({n}/3): Siegelwachs (Diego hilft), ein rotes Band im Innenhof, ein Tintenfass in der Bibliothek."},{"flag":"q03_erinnert","text":"Bring die Erinnerungsstücke zu Pimpernell."},{"flag":"q03_clavis","text":"Die Briefkapsel ist verschlossen. Lass dir von Prof. Pendel im Uhrenturm einen Öffnungszauber zeigen."},{"flag":"q03_offen","text":"Öffne Pimpernells Briefkapsel mit dem richtigen Zauber (A bei Pimpernell)."}]},"Q04":{"day":4,"title":"Das Herz des Uhrenturms","start":"q04_start","fragment":"Alle dreihundert Winter schlägt die Turmuhr für ihn.","steps":[{"flag":"q04_pendel","text":"Sprich mit Prof. Pendel im Uhrenturm."},{"flag":"q04_zahnrad","text":"Finde das fehlende Zahnrad. Diego hat die beste Nase (Taste B)."},{"flag":"q04_eingesetzt","text":"Setz das Zahnrad ins Uhrwerk ein – mit dem richtigen Zauber."},{"flag":"q04_uhrmeister","text":"Sprich mit dem Uhrmeister und löse seine Uhr-Rätsel."}]},"N_knarz":{"day":1,"neben":true,"title":"Knarz’ Schlüsselbund","steps":[{"flag":"knarz_auftrag","text":"Sprich mit Hausmeister Knarz im Schlosskern."},{"flag":"knarz_schluessel","text":"Such den Schlüsselbund im verschneiten Innenhof. Diego kann ihn erschnüffeln (B)."},{"flag":"knarz_fertig","text":"Bring Knarz den Schlüsselbund zurück."}]}},"musik":{"kamin":{"bpm":92,"voices":[{"inst":"spieluhr","vol":0.55,"notes":"A4:2 C5:2 F5:2 E5:3 D5:1 C5:2 A#4:2 D5:2 G5:2 F5:4 E5:2 D5:2 F5:2 A5:2 G5:3 F5:1 E5:2 D5:2 C5:2 E5:2 F5:6 C5:2 A4:2 C5:2 D5:3 C5:1 A#4:2 A4:2 F4:2 A4:2 G4:6 A4:2 C5:2 F5:2 E5:2 G5:2 A#5:2 A5:3 G5:1 E5:2 F5:6"},{"inst":"bass","vol":0.5,"notes":"F2:2 A3:2 C4:2 C3:2 E3:2 G3:2 G2:2 A#3:2 D4:2 C3:2 E3:2 G3:2 D3:2 F3:2 A3:2 C3:2 E3:2 G3: uhr","vol":0.45,"notes":"A4:1 -:1 E5:1 -:1 A4:1 -:1 E5:1 -:1 C5:1 -:1 E5:1 -:1 B4:2 -:2 A4:1 -:1 E5:1 -:1 A4:1 -:1 F5:1 -:1 E5:2 D5:2 C5:2 B4:2"},{"inst":"bass","vol":0.45,"notes":"A2:4 E2:4 A2:4 E2:4 F2:4 C3:4 E2:4 E2:4"},{"inst":"flaeche","vol":0.32,"notes":"A2:8 A2:8 F2:8 E2:8"}]},"kampf":{"bpm":150,"voices":[{"inst":"blech","vol":0.5,"notes":"D4:3 A4:1 D5:4 C5:2 A#4:2 A4:2 G4:2 A4:3 F4:1 A4:2 C5:2 D5:6 -:2 F5:3 E5:1 D5:2 C5:2 A#4:3 C5:1 D5:2 A4:2 G4:2 A#4:2 A4:2 G4:2 A4:4 C#5:2 E5:2"},{"inst":"zupf","vol":0.32,"notes":"D4:1 F4:1 A4:1 F4:1 D4:1 F4:1 A4:1 F4:1 G4:1 A#4:1 D5:1 A#4:1 G4:1 A#4:1 D5:1 A#4:1 F4:1 A4:1 C5:1 A4:1 F4:1 A4:1 C5:1 A4:1 D4:1 F4:1 A4:1 F4:1 D4:1 F4:1 A4:1 F4:1 F4:1 A4:1 C5:1 A4:1 F4:1 A4:1 C5:1 A4:1 G4:1 A#4:1 D5:1 A#4:1 G4:1 A#4:1 D5:1 A#4:1 C4:1 E4:1 G4:1 E4:1 C4:1 E4:1 G4:1 E4:1 A4:1 C#5:1 E5:1 C#5:1 A4:1 C#5:1 E5:1 C#5:1"},{"inst":"bass","vol":0.5,"notes":"D2:2 D3:2 D2:2 D3:2 G2:2 G3:2 G2:2 G3:2 F2:2 F3:2 F2:2 F3:2 D2:2 D3:2 D2:2 D3:2 F2:2 F3:2 F2:2 F3:2 G2:2 G3:2 G2:2 G3:2 C2:2 C3:2 C2:2 C3:2 A2:2 A3:2 A2:2 A3:2"},{"inst":"pauke","vol":0.6,"notes":"D2:2 -:1 D2:1 D2:2 D2:2 G2:2 -:1 G2:1 G2:2 G2:2 F2:2 -:1 F2:1 F2:2 F2:2 D2:2 -:1 D2:1 D2:2 D2:2 F2:2 -:1 F2:1 F2:2 F2:2 G2:2 -:1 G2:1 G2:2 G2:2 C2:2 -:1 C2:1 C2:2 C2:2 A2:2 -:1 A2:1 A2:2 A2:2"},{"inst":"flaeche","vol":0.24,"notes":"D3:8 G3:8 F3:8 D3:8 F3:8 G3:8 C3:8 A3:8"}]}},"puzzles":{"kerzen":{"order":[2,4,1,3],"notes":["C5","E5","G5","C6"],"win":{"dialog":"q02_geschafft","set":["q02_kerzen"],"sound":"fund"},"fail":{"dialog":"kerzen_falsch"},"failSound":"jaul","focus":[11.5,8]},"uhrmeister":{"fragen":[{"text":"Das Frühstück in der Großen Halle beginnt um 7 Uhr. Der Unterricht beginnt zwei Stunden später. Stell meinen Zeiger auf den Unterrichtsbeginn.","stunde":9},{"text":"Heute Nacht lief ich rückwärts. Um Mitternacht fing es an, fünf Stunden lief ich zurück. Auf welcher Stunde stand mein Zeiger am Ende?","stunde":7},{"text":"Pimpernell fliegt um 3 Uhr los. Sie braucht 4 Stunden ins Dorf, r // ===== Grundlagen (ohne DOM, in Node testbar) =====
const SAVE_VERSION = 2;
const SAVE_KEY = 'winterphoenix_save';
const TEST_KEY = 'winterphoenix_test';
const SOUND_KEY = 'winterphoenix_ton';
const WATERMARK = 'Entwickelt und erstellt von Jörn Löwenstein mit Hilfe von künstlicher Intelligenz (Claude)';
const TILE = 32;
const VIEW_W = 512, VIEW_H = 384;
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

const isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);
const isNum = v => typeof v === 'number' && isFinite(v);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pickOne = (arr, rnd) => arr[Math.floor((rnd || Math.random)() * arr.length) % arr.length];

// Kleiner, stabiler Prüfwert für Export-Codes
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36);
}
function utf8ToB64(s) {
  const bytes = new TextEncoder().encode(s); let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64ToUtf8(b) {
  const bin = atob(b); const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

// ===== Tagesfreischaltung (Europe/Berlin) =====
const SEASON_YEAR = 2026;

function berlinDate(now) {
  const parts = new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Europe/Berlin', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
  }).formatToParts(now);
  const o = {};
  parts.forEach(p => { if (p.type !== 'literal') o[p.type] = parseInt(p.value, 10); });
  return { y: o.year, m: o.month, d: o.day, h: o.hour % 24, min: o.minute };
}

// 0 = vor dem 1. Dezember, 1..24 = freigeschaltete Tage, ab 24.12. bleibt alles offen
function unlockedDay(now) {
  const b = berlinDate(now);
  if (b.y > SEASON_YEAR) return 24;
  if (b.y < SEASON_YEAR || b.m < 12) return 0;
  return Math.min(24, b.d);
}

function daysUntilStart(now) {
  if (unlockedDay(now) > 0) return 0;
  const b = berlinDate(now);
  const a = Date.UTC(b.y, b.m - 1, b.d), s = Date.UTC(SEASON_YEAR, 11, 1);
  return Math.max(0, Math.round((s - a) / 864e5));
}

// ?testtag=N (0..24) -> Zahl, sonst null
function parseTestDay(search) {
  const m = /[?&]testtag=(\d{1,2})(?:&|$)/.exec(search || '');
  if (!m) return null;
  const n = parseInt(m[1], 10);
  return n >= 0 && n <= 24 ? n : null;
}

// ===== Bedingungen und Aktionen aus den Daten =====
// Bedingungen: "flag:x", "day>=3", "quest:Q01" (offen und aktiv), "done:Q01",
// "follower:diego". Ein "!" davor kehrt um.
// ctx: { flags, day, done[], followers[] }

function questIsActive(id, ctx) {
  const q = DATA.quests[id];
  return !!q && q.day <= ctx.day && ctx.done.indexOf(id) < 0;
}

function checkCond(c, ctx) {
  if (typeof c !== 'string') return false;
  if (c[0] === '!') return !checkCond(c.slice(1), ctx);
  let m;
  if ((m = /^flag:(\w+)$/.exec(c))) return !!ctx.flags[m[1]];
  if ((m = /^day>=(\d+)$/.exec(c))) return ctx.day >= +m[1];
  if ((m = /^day<(\d+)$/.exec(c))) return ctx.day < +m[1];
  if ((m = /^quest:(\w+)$/.exec(c))) return questIsActive(m[1], ctx);
  if ((m = /^done:(\w+)$/.exec(c))) return ctx.done.indexOf(m[1]) >= 0;
  if ((m = /^follower:(\w+)$/.exec(c))) return ctx.followers.indexOf(m[1]) >= 0;
  return false;
}
const COND_RE = /^!?(flag:\w+|day>=\d+|day<\d+|quest:\w+|done:\w+|follower:\w+)$/;

function condsOk(list, ctx) { return !list || list.every(c => checkCond(c, ctx)); }

// Erste passende Gesprächs-/Untersuchen-Regel aus einer Liste
function pickTalk(list, ctx) {
  if (!Array.isArray(list)) return null;
  for (const t of list) if (condsOk(t.if, ctx)) return t;
  return null;
}

// ===== Spielstand: Format, Migration, Speicher, Export =====
// Regel: Ein Update darf einen Spielstand nie löschen. Unbekannte Felder bleiben erhalten.

function newSave(now) {
  const s = DATA.welt.start;
  return {
    v: SAVE_VERSION, created: now, updated: now,
    map: s.map, x: s.x, y: s.y, dir: s.dir,
    flags: {}, done: [], fragments: [], secrets: [],
    followers: ['joern'], seenDay: 0, playMs: 0,
    waerme: WAERME_GRUND, energie: ENERGIE_MAX, ep: 0, stufe: 1, kraft: 0, lp: 0, wahl: 0, kakao: KAKAO_START, warm: null, besucht: [s.map], glut: [],
  };
}

// Migrationen: MIGRATIONS[n] macht aus Version n die Version n+1
const MIGRATIONS = {
  // v0 = Vorab-Format (nur zum Test der Migrationskette): {version:0, pos:{map,x,y}, flags}
  0: d => {
    const out = Object.assign({}, d);
    out.v = 1;
    if (isObj(d.pos)) { out.map = d.pos.map; out.x = d.pos.x; out.y = d.pos.y; }
    delete out.pos; delete out.version;
    return out;
  },
  // v1 → v2 (Stufe S2): Wärme, letzter warmer Ort, besuchte Orte (Schlosskarte), Glutsplitter
  1: d => {
    const out = Object.assign({}, d);
    out.waerme = WAERME_GRUND; out.warm = null; out.glut = [];
    out.besucht = typeof d.map === 'string' ? [d.map] : [];
    return out;
  },
};

// Liefert {save, warnings} oder null, wenn gar nichts zu retten ist
function migrateSave(raw) {
  if (!isObj(raw)) return null;
  let d = Object.assign({}, raw);
  const warnings = [];
  let v = isNum(d.v) ? d.v : (isNum(d.version) ? d.version : null);
  if (v === null) return null;
  while (v < SAVE_VERSION) {
    if (!MIGRATIONS[v]) return null;
    d = MIGRATIONS[v](d); v += 1; d.v = v;
    warnings.push('migriert auf v' + v);
  }
  // Neuere Version (z. B. nach einem Zurücksetzen): behalten, nichts herabstufen
  if (v > SAVE_VERSION) warnings.push('Spielstand stammt aus neuerer Version');

  const s = newSave(isNum(d.created) ? d.created : 0);
  const out = Object.assign({}, d);
  out.v = Math.max(v, SAVE_VERSION);
  out.created = isNum(d.created) ? d.created : 0;
  out.updated = isNum(d.updated) ? d.updated : 0;
  out.flags = {};
  if (isObj(d.flags)) Object.keys(d.flags).forEach(k => {
    const val = d.flags[k];
    if (/^\w{1,60}$/.test(k) && (typeof val === 'boolean' || isNum(val))) out.flags[k] = val;
  });
  const strList = a => Array.isArray(a) ? a.filter(x => typeof x === 'string' && x.length < 60) : [];
  out.done = strList(d.done);
  out.fragments = strList(d.fragments);
  out.secrets = strList(d.secrets);
  out.followers = strList(d.followers).filter(f => DATA.characters[f]);
  if (out.followers.indexOf('joern') < 0) out.followers.unshift('joern');
  out.seenDay = isNum(d.seenDay) ? clamp(d.seenDay, 0, 24) : 0;
  out.playMs = isNum(d.playMs) ? d.playMs : 0;
  out.glut = strList(d.glut);
  const zahl = (v, a, b, def) => isNum(v) ? clamp(Math.round(v), a, b) : def;
  out.stufe = zahl(d.stufe, 1, STUFE_MAX, 1); out.ep = zahl(d.ep, 0, 9999, 0);
  out.kraft = zahl(d.kraft, 0, STUFE_MAX, 0); out.lp = zahl(d.lp, 0, STUFE_MAX, 0); out.wahl = zahl(d.wahl, 0, STUFE_MAX, 0);
  out.besucht = strList(d.besucht).filter(k => DATA.maps[k]);
  out.waerme = isNum(d.waerme) ? clamp(Math.round(d.waerme), 1, waermeMax(out)) : waermeMax(out);
  out.energie = isNum(d.energie) ? clamp(Math.round(d.energie), 0, ENERGIE_MAX) : ENERGIE_MAX;
  out.kakao = isNum(d.kakao) ? clamp(Math.round(d.kakao), 0, KAKAO_MAX) : KAKAO_START;
  const w = d.warm, wm = isObj(w) && typeof w.map === 'string' && DATA.maps[w.map];
  out.warm = wm && isNum(w.x) && isNum(w.y) && !tileSolid(wm, w.x, w.y) && DIRS[w.dir] ? { map: w.map, x: w.x, y: w.y, dir: w.dir } : null;
  // Position: unbekannte Karte oder Wand -> sicher zum Start, Fortschritt bleibt
  const m = typeof d.map === 'string' && DATA.maps[d.map];
  const posOk = m && isNum(d.x) && isNum(d.y) && d.x >= 0 && d.y >= 0 && d.y < m.tiles.length && d.x < m.tiles[0].length
    && !(DATA.tiles[m.tiles[d.y][d.x]] || {}).solid;
  if (posOk) { out.map = d.map; out.x = d.x; out.y = d.y; }
  else { out.map = s.map; out.x = s.x; out.y = s.y; warnings.push('Position zurückgesetzt'); }
  out.dir = DIRS[d.dir] ? d.dir : 'down';
  return { save: out, warnings };
}

// st: Objekt mit getItem/setItem (localStorage oder Testattrappe)
function storeLoad(st, key) {
  const tryParse = raw => { try { return migrateSave(JSON.parse(raw)); } catch (e) { return null; } };
  let raw = null;
  try { raw = st.getItem(key); } catch (e) { return { save: null, source: null, broken: false }; }
  if (raw) {
    const r = tryParse(raw);
    if (r) return { save: r.save, warnings: r.warnings, source: 'main', broken: false };
    // Kaputt: Rohdaten aufheben (nie löschen), dann Sicherung versuchen
    try { if (st.getItem(key + '_defekt') !== raw) st.setItem(key + '_defekt', raw); } catch (e) {}
  }
  let braw = null;
  try { braw = st.getItem(key + '_backup'); } catch (e) {}
  if (braw) {
    const r = tryParse(braw);
    if (r) return { save: r.save, warnings: r.warnings, source: 'backup', broken: !!raw };
  }
  return { save: null, source: null, broken: !!raw };
}

function storeWrite(st, key, save) {
  try {
    const old = st.getItem(key);
    // Vorherigen Stand nur dann als Sicherung behalten, wenn er gültig ist
    if (old) { let ok = false; try { ok = !!migrateSave(JSON.parse(old)); } catch (e) {} if (ok) st.setItem(key + '_backup', old); }
    st.setItem(key, JSON.stringify(save));
    return true;
  } catch (e) { return false; }
}

// Export-Code: WP1-<base64>-<prüfwert>
function exportCode(save) {
  const json = JSON.stringify(save);
  return 'WP1-' + utf8ToB64(json) + '-' + hashStr(json);
}
function importCode(code) {
  const c = String(code || '').replace(/\s+/g, '');
  const m = /^WP1-([A-Za-z0-9+/=]+)-([0-9a-z]+)$/.exec(c);
  if (!m) return { error: 'Das ist kein gültiger Spielstand-Code.' };
  let json;
  try { json = b64ToUtf8(m[1]); } catch (e) { return { error: 'Der Code ist beschädigt.' }; }
  if (hashStr(json) !== m[2]) return { error: 'Der Code ist unvollständig oder verändert.' };
  let r = null;
  try { r = migrateSave(JSON.parse(json)); } catch (e) {}
  if (!r) return { error: 'Der Code enthält keinen lesbaren Spielstand.' };
  return { save: r.save };
}

// ---- src/core/world.js ----
// ===== Welt: Karten, Kollision, Wege =====
function mapW(m) { return m.tiles[0].length; }
function mapH(m) { return m.tiles.length; }
function tileChar(m, x, y) {
  if (y < 0 || y >= m.tiles.length || x < 0 || x >= m.tiles[0].length) return null;
  return m.tiles[y][x];
}
function tileSolid(m, x, y) {
  const c = tileChar(m, x, y);
  return c === null || !!(DATA.tiles[c] || {}).solid;
}
function objType(o) { return DATA.objects[o.type]; }
function objSolid(o) { return o.solid !== undefined ? !!o.solid : !!objType(o).solid; }
function objCovers(o, x, y) {
  const t = objType(o);
  return x >= o.x && x < o.x + t.w && y >= o.y && y < o.y + t.h;
}
function visibleObjs(m, ctx) { return (m.objects || []).filter(o => condsOk(o.if, ctx)); }
function visibleNpcs(m, ctx) { return (m.npcs || []).filter(n => condsOk(n.if, ctx)); }
function objAt(m, x, y, ctx) { return visibleObjs(m, ctx).find(o => objCovers(o, x, y)) || null; }
function npcAt(m, x, y, ctx) { return visibleNpcs(m, ctx).find(n => n.x === x && n.y === y) || null; }
function spotAt(m, x, y, ctx) { return (m.spots || []).find(s => s.x === x && s.y === y && condsOk(s.if, ctx)) || null; }
function doorAt(m, x, y) { return (m.doors || []).find(d => d.x === x && d.y === y) || null; }
function secretAt(m, x, y, ctx) { return (m.secrets || []).find(s => s.x === x && s.y === y && condsOk(s.if, ctx)) || null; }

function blockedAt(m, x, y, ctx) {
  if (tileSolid(m, x, y)) return true;
  if (visibleObjs(m, ctx).some(o => objSolid(o) && objCovers(o, x, y))) return true;
  if (npcAt(m, x, y, ctx)) return true;
  return false;
}

// Kürzester Weg (Breitensuche) bis auf das Ziel oder direkt daneben (Ziel darf fest sein)
function findPath(m, from, to, ctx, maxLen) {
  const w = mapW(m), h = mapH(m), key = (x, y) => y * w + x;
  const prev = new Map(); prev.set(key(from.x, from.y), null);
  const q = [[from.x, from.y]];
  const isGoal = (x, y) => Math.abs(x - to.x) + Math.abs(y - to.y) <= (blockedAt(m, to.x, to.y, ctx) ? 1 : 0);
  while (q.length) {
    const [x, y] = q.shift();
    if (isGoal(x, y)) {
      const path = []; let k = key(x, y);
      while (k !== null) { path.unshift({ x: k % w, y: Math.floor(k / w) }); k = prev.get(k); }
      return path.length - 1 <= (maxLen || 99) ? path : null;
    }
    for (const d of Object.values(DIRS)) {
      const nx = x + d[0], ny = y + d[1], k = key(nx, ny);
      if (nx < 0 || ny < 0 || nx >= w || ny >= h || prev.has(k)) continue;
      if (blockedAt(m, nx, ny, ctx)) continue;
      prev.set(k, key(x, y)); q.push([nx, ny]);
    }
  }
  return null;
}

// ---- src/core/quests.js ----
// ===== Quests =====
function questIds() {
  return Object.keys(DATA.quests).sort((a, b) => DATA.quests[a].day - DATA.quests[b].day || (a < b ? -1 : 1));
}
function stepFlags(st) { return st.flags || [st.flag]; }
function stepDone(st, flags) { return stepFlags(st).every(f => !!flags[f]); }
function stepCount(st, flags) { return stepFlags(st).filter(f => !!flags[f]).length; }
function questComplete(q, flags) {
  return !q.teilweise && q.steps.every(st => stepDone(st, flags));
}
// Prüft offene Quests; gibt neu abgeschlossene IDs zurück und trägt Fragmente ein
function updateQuests(save, day) {
  const neu = [];
  questIds().forEach(id => {
    const q = DATA.quests[id];
    if (q.day > day || save.done.indexOf(id) >= 0) return;
    if (questComplete(q, save.flags)) {
      save.done.push(id);
      if (!q.neben && save.fragments.indexOf(id) < 0) save.fragments.push(id);
      neu.push(id);
    }
  });
  return neu;
}
function allSecretIds() {
  const ids = [];
  Object.keys(DATA.maps).forEach(mid => (DATA.maps[mid].secrets || []).forEach(s => { if (s.count !== false) ids.push(s.id); }));
  return ids;
}

// ---- src/core/kampf.js ----
// ===== Kampf: Regeln ohne Darstellung (in Node testbar) =====
// Rundenbasiert: Charly wählt eine Aktion (für sich, Jörn oder Diego), danach handeln die Gegner.
// Wärme statt Lebenspunkte, Energie für Zauber, Kakao begrenzt (Jörn kann neuen kochen).
// Bei 0 Wärme kein Game Over: Charly wacht im Warmen wieder auf.

const WAERME_GRUND = 10;
const ENERGIE_MAX = 6;
const KAKAO_MAX = 5, KAKAO_START = 3;
const STUFE_MAX = 20;
// Je 3 Glutsplitter: 2 Wärme mehr; dazu je 2 Wärme für jede Stufe, bei der „Lebenspunkte“ gewählt wurde
function waermeMax(save) { return WAERME_GRUND + 2 * Math.floor(((save && save.glut) || []).length / 3) + 2 * ((save && save.lp) || 0); }

// --- Erfahrung und Stufen ---
// EP bis zur nächsten Stufe: 10, 15, 20, …
function epFuerStufe(stufe) { return 10 + 5 * (stufe - 1); }
// Gibt EP; liefert die Zahl der neuen Stufen (jede Stufe = eine Wahl: Kraft oder Lebenspunkte)
function epGeben(save, n) {
  let neu = 0;
  save.ep = (save.ep || 0) + n;
  while (save.stufe < STUFE_MAX && save.ep >= epFuerStufe(save.stufe)) { save.ep -= epFuerStufe(save.stufe); save.stufe++; save.wahl = (save.wahl || 0) + 1; neu++; }
  if (save.stufe >= STUFE_MAX) save.ep = 0;
  return neu;
}
function stufeWaehlen(save, was) {
  if (!(save.wahl > 0)) return false;
  save.wahl--;
  if (was === 'kraft') save.kraft = (save.kraft || 0) + 1; else { save.lp = (save.lp || 0) + 1; save.waerme = (save.waerme || 0) + 2; }
  return true;
}
// Charlys Schaden: Kraft macht den richtigen Zauber stärker, jede zweite Kraft auch Schneeball und andere Zauber
function schadenStark(F) { return DATA.kampf.regeln.zauberSchaden + F.kraft; }
function schadenSchwach(F) { return 1 + Math.floor(F.kraft / 2); }

function kampfNeu(gruppeId, opt) {
  opt = opt || {};
  const g = DATA.kampf.gruppen[gruppeId];
  const max = opt.max || WAERME_GRUND, emax = opt.emax || ENERGIE_MAX;
  return {
    gruppe: gruppeId, tutorial: !!g.tutorial, flucht: g.flucht !== false,
    gegner: g.gegner.map((id, i) => { const t = DATA.kampf.gegner[id]; return { id, nr: i, kraft: t.kraft, max: t.kraft, aus: 0, immun: false, erkannt: false }; }),
    waerme: clamp(isNum(opt.waerme) ? opt.waerme : max, 1, max), max,
    energie: clamp(isNum(opt.energie) ? opt.energie : emax, 0, emax), emax,
    kakao: clamp(isNum(opt.kakao) ? opt.kakao : KAKAO_START, 0, KAKAO_MAX),
    kochen: 0, eingefroren: false, mut: 0, runde: 1, ende: null, kraft: opt.kraft || 0,
    zauber: opt.zauber || [], diego: opt.diego !== false, joern: opt.joern !== false,
  };
}
function kampfLebend(F) { return F.gegner.filter(e => e.kraft > 0); }
const gName = e => DATA.kampf.gegner[e.id].name;
const fill = (s, e) => s.replace(/\{name\}/g, e ? gName(e) : '');

// Welche Aktionen gerade möglich sind (ok) und warum nicht (warum)
function kampfAktionen(F) {
  const K = DATA.kampf, T = K.texte, kosten = K.regeln.zauberKosten;
  const charly = (art, label, ok, warum) => ({ art, label, wer: 'charly', ok: ok && !F.eingefroren, warum: F.eingefroren ? T.warum_eingefroren : warum });
  const a = [
    charly('zaubern', 'Zaubern', F.zauber.length > 0 && F.energie >= kosten, !F.zauber.length ? T.warum_keinzauber : T.warum_energie),
    charly('schneeball', 'Schneeball', true, ''),
  ];
  if (F.joern) {
    a.push({ art: 'kakao', label: 'Kakao (' + F.kakao + ')', wer: 'joern', ok: F.kakao > 0 && !F.kochen, warum: F.kochen ? T.warum_kocht : T.warum_kakao });
    a.push({ art: 'kochen', label: 'Kakao kochen', wer: 'joern', ok: !F.kochen && F.kakao < KAKAO_MAX, warum: F.kochen ? T.warum_kocht : T.warum_voll });
    a.push({ art: 'mut', label: 'Mut zusprechen', wer: 'joern', ok: !F.kochen && F.energie > 0, warum: F.kochen ? T.warum_kocht : T.warum_mut });
  }
  if (F.diego) a.push({ art: 'bellen', label: 'Bellen', wer: 'diego', ok: true }, { art: 'schnueffeln', label: 'Schnüffeln', wer: 'diego', ok: true });
  a.push({ art: 'flucht', label: 'Zurückziehen', wer: 'charly', ok: F.flucht, warum: T.keine_flucht });
  return a;
}
// Braucht die Aktion ein Ziel?
function kampfZielNoetig(art) { return art === 'zauber' || art === 'schneeball' || art === 'bellen'; }

// Führt Charlys Wahl aus und lässt danach die Gegner handeln.
// akt: { art, z (Zauber), ziel (Index) }. Liefert eine Liste von Ereignissen für die Darstellung.
function kampfZug(F, akt, rnd) {
  rnd = rnd || Math.random;
  const ev = [], K = DATA.kampf, R = K.regeln;
  if (F.ende) return ev;
  const erlaubt = kampfAktionen(F).find(a => a.art === (akt.art === 'zauber' ? 'zaubern' : akt.art));
  if (!erlaubt || !erlaubt.ok) { ev.push({ wer: '', text: (erlaubt && erlaubt.warum) || '…', nix: true }); return ev; }
  const lebend = kampfLebend(F);
  let ziel = F.gegner[akt.ziel];
  if (!ziel || ziel.kraft <= 0) ziel = lebend[0];
  const hit = (e, dmg, text, fx) => {
    e.kraft = Math.max(0, e.kraft - dmg);
    ev.push({ wer: 'charly', text, fx, ziel: e.nr, dmg });
    if (e.kraft <= 0) ev.push({ wer: '', text: fill(K.gegner[e.id].besiegt, e), fx: 'weg', ziel: e.nr });
  };
  switch (akt.art) {
    case 'zauber': {
      const T = K.gegner[ziel.id], Z = DATA.zauber[akt.z] || { name: akt.z };
      F.energie = Math.max(0, F.energie - R.zauberKosten);
      if (akt.z === T.schwaeche) {
        // Betäuben nur mit etwas Glück und nie zwei Runden hintereinander
        ziel.erkannt = true;
        const betaeubt = !ziel.immun && rnd() < R.betaeubChance;
        if (betaeubt) ziel.aus = Math.max(ziel.aus, 1);
        hit(ziel, schadenStark(F), Z.name + '! ' + fill(T.treffer, ziel) + (betaeubt ? ' ' + fill(T.betaeubt, ziel) : ''), 'zauber_' + akt.z);
      } else if (T.ausweichen && rnd() < T.ausweichen) {
        ev.push({ wer: 'charly', text: Z.name + '! ' + fill(T.ausgewichen, ziel), fx: 'zauber_' + akt.z, ziel: ziel.nr, dmg: 0, vorbei: true });
      } else hit(ziel, schadenSchwach(F), Z.name + '! ' + fill(K.texte.zauber_schwach, ziel), 'zauber_' + akt.z);
      break;
    }
    case 'schneeball': {
      const T = K.gegner[ziel.id];
      if (T.ausweichen && rnd() < T.ausweichen) ev.push({ wer: 'charly', text: fill(T.ausgewichen, ziel), fx: 'schneeball', ziel: ziel.nr, dmg: 0, vorbei: true });
      else hit(ziel, schadenSchwach(F), fill(K.texte.schneeball, ziel), 'schneeball');
      break;
    }
    case 'kakao': {
      F.kakao--;
      const w = Math.min(R.kakaoWaerme, F.max - F.waerme), e = Math.min(R.kakaoEnergie, F.emax - F.energie);
      F.waerme += w; F.energie += e;
      ev.push({ wer: 'joern', text: K.texte.kakao.replace('{w}', String(w)).replace('{e}', String(e)), fx: 'kakao', heil: w, energie: e });
      break;
    }
    case 'kochen': F.kochen = R.kochRunden; ev.push({ wer: 'joern', text: K.texte.kochen, fx: 'kochen' }); break;
    case 'mut': F.mut = R.mutRunden; ev.push({ wer: 'joern', text: K.texte.mut, fx: 'mut' }); break;
    case 'bellen':
      if (ziel.immun) { ev.push({ wer: 'diego', text: fill(K.texte.bellen_immun, ziel), fx: 'bellen', ziel: ziel.nr }); break; }
      ziel.aus = Math.max(ziel.aus, 1); ev.push({ wer: 'diego', text: fill(K.texte.bellen, ziel), fx: 'bellen', ziel: ziel.nr }); break;
    case 'schnueffeln': {
      lebend.forEach(e => {
        e.erkannt = true;
        const z = K.gegner[e.id].schwaeche, Z = DATA.zauber[z];
        const kann = F.zauber.indexOf(z) >= 0;
        ev.push({ wer: 'diego', text: fill(K.gegner[e.id].hinweis, e) + (kann ? ' ' + K.texte.hinweis_kann.replace('{z}', Z.name) : ' ' + K.texte.hinweis_fehlt), fx: 'schnueffeln', ziel: e.nr });
      });
      break;
    }
    case 'flucht': F.ende = 'flucht'; ev.push({ wer: '', text: K.texte.flucht, fx: 'flucht' }); return ev;
    default: return ev;
  }
  F.eingefroren = false;
  if (!kampfLebend(F).length) { F.ende = 'sieg'; kochFertig(F, ev, true); return ev; }
  // Gegner sind dran
  kampfLebend(F).forEach(e => {
    if (F.ende) return;
    const T = K.gegner[e.id];
    if (e.aus > 0) { e.aus--; e.immun = true; ev.push({ wer: '', text: fill(T.aussetzen, e), fx: 'aus', ziel: e.nr }); return; }
    e.immun = false;
    // Frost-Angriff: Charly friert fest und muss eine Runde aussetzen
    if (T.frieren && !F.eingefroren && rnd() < T.frieren) {
      const dmg = 1; F.waerme = Math.max(0, F.waerme - dmg); F.eingefroren = true;
      ev.push({ wer: '', text: fill(T.frost, e) + ' ' + K.texte.kalt.replace('{n}', String(dmg)), fx: 'angriff', frost: true, von: e.nr, schaden: dmg });
    } else {
      let dmg = pickOne(T.angriff, rnd);
      const geschuetzt = F.mut > 0 && dmg > 0;
      if (geschuetzt) dmg = Math.max(0, dmg - R.mutSchutz);
      F.waerme = Math.max(0, F.waerme - dmg);
      ev.push({ wer: '', text: fill(pickOne(T.angriffe, rnd), e) + (geschuetzt ? ' ' + K.texte.geschuetzt : '') + (dmg ? ' ' + K.texte.kalt.replace('{n}', String(dmg)) : ''), fx: 'angriff', von: e.nr, schaden: dmg });
    }
    if (F.waerme <= 0) { F.ende = 'kalt'; ev.push({ wer: '', text: K.texte.erfroren, fx: 'kalt' }); }
  });
  if (F.mut > 0) F.mut--;
  if (!F.ende) kochFertig(F, ev, false);
  F.runde++;
  return ev;
}
// Jörns Kakao am Feuer: nach drei Runden 2 Becher mehr (bei Kampfende sofort fertig)
function kochFertig(F, ev, sofort) {
  if (!F.kochen) return;
  F.kochen = sofort ? 0 : F.kochen - 1;
  if (F.kochen) return;
  const plus = Math.min(DATA.kampf.regeln.kochMenge, KAKAO_MAX - F.kakao); F.kakao += plus;
  ev.push({ wer: 'joern', text: DATA.kampf.texte.kakao_fertig.replace('{n}', String(plus)), fx: 'kakao_fertig', kakaoPlus: plus });
}

// Zufällige Begegnung für eine Karte und einen Tag (gewichtete Auswahl)
function kampfGruppeWaehlen(kampf, day, rnd, stufe) {
  const list = (kampf.gruppen || []).filter(g => day >= g.ab && (stufe || 1) >= (g.stufe || 1));
  const sum = list.reduce((s, g) => s + (g.w || 1), 0);
  if (!sum) return null;
  let r = (rnd || Math.random)() * sum;
  for (const g of list) { r -= g.w || 1; if (r < 0) return g.g; }
  return list[list.length - 1].g;
}

// ---- src/core/validate.js ----
// ===== Datenprüfung (läuft beim Bauen und in den Tests) =====
function validateData() {
  const errors = [], warnings = [];
  const E = m => errors.push(m), Wn = m => warnings.push(m);
  const maps = DATA.maps, dlg = DATA.dialogs, chars = DATA.characters;
  const setFlags = new Set();

  function checkDialogRef(id, where) {
    const ids = Array.isArray(id) ? id : [id];
    ids.forEach(d => { if (!dlg[d]) E(where + ': Dialog „' + d + '“ fehlt'); });
  }
  function checkConds(list, where) {
    (list || []).forEach(c => { if (!COND_RE.test(c)) E(where + ': unbekannte Bedingung „' + c + '“'); });
  }
  function checkAction(a, where) {
    if (!a) return;
    checkConds(a.if, where);
    if (a.dialog) checkDialogRef(a.dialog, where);
    (a.set || []).forEach(f => setFlags.add(f));
    if (a.join && !chars[a.join]) E(where + ': Begleiter „' + a.join + '“ unbekannt');
    if (a.leave && !chars[a.leave]) E(where + ': Begleiter „' + a.leave + '“ unbekannt');
    if (a.zauber && !DATA.zauber[a.zauber]) E(where + ': Zauber „' + a.zauber + '“ fehlt');
    if (a.seq && !DATA.puzzles[a.seq]) E(where + ': Rätsel „' + a.seq + '“ fehlt');
    if (a.demo && !DATA.puzzles[a.demo]) E(where + ': Rätsel „' + a.demo + '“ fehlt');
    if (a.kampf) {
      if (!DATA.kampf.gruppen[a.kampf]) E(where + ': Kampf-Gruppe „' + a.kampf + '“ fehlt');
      else kampfRegel(a.kampf, a.if, null, where);
      checkAction(a.win, where + ' Sieg'); if (!a.win) E(where + ': Kampf ohne Sieg-Aktion');
    }
    if (a.glut) setFlags.add('glut_' + a.glut);
    if (a.minigame) { if (a.minigame.type !== 'takt' && a.minigame.type !== 'uhr') E(where + ': unbekanntes Minispiel'); if (a.minigame.type === 'uhr' && !(DATA.puzzles[a.minigame.raetsel] || {}).fragen) E(where + ': Uhr-Rätsel fehlt'); checkAction(a.win, where + ' Sieg'); if (!a.win) E(where + ': Minispiel ohne Sieg-Aktion'); }
  }
  // Regel aus dem Fahrplan: Ein Gegner darf erst auftauchen, wenn seine Schwäche als Zauber gelernt werden kann.
  // Belegt durch "day>=N" (N ≥ Lerntag) oder "flag:zauber_x" in den Bedingungen bzw. "ab" bei Zufallskämpfen.
  function kampfRegel(gid, conds, ab, where) {
    const g = DATA.kampf.gruppen[gid];
    let tag = ab || 0; const flags = [];
    (conds || []).forEach(c => { let m; if ((m = /^day>=(\d+)$/.exec(c))) tag = Math.max(tag, +m[1]); if ((m = /^flag:zauber_(\w+)$/.exec(c))) flags.push(m[1]); });
    g.gegner.forEach(id => {
      const T = DATA.kampf.gegner[id];
      if (!T) return E(where + ': Gegner „' + id + '“ fehlt');
      const Z = DATA.zauber[T.schwaeche];
      if (!Z) return E('Gegner ' + id + ': Schwäche-Zauber „' + T.schwaeche + '“ fehlt');
      if (flags.indexOf(T.schwaeche) < 0 && tag < Z.tag) E(where + ': ' + T.name + ' taucht ab Tag ' + tag + ' auf, ' + Z.name + ' gibt es aber erst ab Tag ' + Z.tag);
    });
  }
  const checkTalk = (list, where) => (list || []).forEach((t, i) => checkAction(t, where + '[' + i + ']'));

  // Dialoge: Sprecher müssen existieren, Zeilen nicht zu lang
  Object.keys(dlg).forEach(id => {
    if (!Array.isArray(dlg[id]) || !dlg[id].length) return E('Dialog ' + id + ' ist leer');
    dlg[id].forEach(([sp, tx], i) => {
      if (sp && !chars[sp]) E('Dialog ' + id + '[' + i + ']: Sprecher „' + sp + '“ unbekannt');
      if (typeof tx !== 'string' || !tx) E('Dialog ' + id + '[' + i + ']: Text fehlt');
      else if (tx.length > 190) Wn('Dialog ' + id + '[' + i + '] ist sehr lang (' + tx.length + ' Zeichen)');
    });
  });
  Object.keys(chars).forEach(c => checkTalk(chars[c].talk, 'Figur ' + c));

  // Musik: jede Note muss lesbar sein (z. B. A#4:2, Pause -:6)
  Object.keys(DATA.musik).forEach(id => (DATA.musik[id].voices || []).forEach((vc, i) => vc.notes.trim().split(/\s+/).forEach(tok => {
    if (!/^([A-G][#b]?[0-8]|-):\d+(\.\d+)?$/.test(tok)) E('Musik ' + id + ' Stimme ' + i + ': unlesbare Note „' + tok + '“');
  })));

  // Karten
  if (!maps[DATA.welt.start.map]) E('Startkarte fehlt');
  Object.keys(maps).forEach(mid => {
    const m = maps[mid], w = m.tiles[0].length, where = 'Karte ' + mid;
    m.tiles.forEach((row, y) => {
      if (row.length !== w) E(where + ': Zeile ' + y + ' hat falsche Länge');
      for (const ch of row) if (!DATA.tiles[ch]) E(where + ': unbekannte Kachel „' + ch + '“ in Zeile ' + y);
    });
    const inB = (x, y) => x >= 0 && y >= 0 && x < w && y < m.tiles.length;
    if (m.music && !DATA.musik[m.music]) E(where + ': Musik „' + m.music + '“ fehlt');
    (m.objects || []).forEach((o, i) => {
      const t = DATA.objects[o.type];
      if (!t) return E(where + ': Objekt-Typ „' + o.type + '“ fehlt');
      if (!inB(o.x, o.y) || !inB(o.x + t.w - 1, o.y + t.h - 1)) E(where + ': Objekt ' + o.type + ' liegt außerhalb');
      checkConds(o.if, where + ' Objekt ' + i); checkTalk(o.talk, where + ' Objekt ' + o.type);
    });
    (m.npcs || []).forEach(n => {
      if (!chars[n.char]) E(where + ': NPC-Figur „' + n.char + '“ fehlt');
      if (!inB(n.x, n.y)) E(where + ': NPC ' + n.char + ' außerhalb');
      checkConds(n.if, where + ' NPC ' + n.char); checkTalk(n.talk, where + ' NPC ' + n.char);
    });
    (m.spots || []).forEach((s, i) => { if (!inB(s.x, s.y)) E(where + ': Stelle ' + i + ' außerhalb'); checkConds(s.if, where); checkTalk(s.talk, where + ' Stelle ' + i); });
    (m.secrets || []).forEach(s => {
      if (!s.id) E(where + ': Geheimnis ohne id');
      if (!inB(s.x, s.y)) E(where + ': Geheimnis ' + s.id + ' außerhalb');
      checkConds(s.if, where + ' Geheimnis ' + s.id); checkAction(s.found, where + ' Geheimnis ' + s.id);
    });
    if (!DATA.karte.orte[mid]) E(where + ': fehlt auf der Schlosskarte (data/karte.json)');
    if (m.kampf) {
      checkConds(m.kampf.if, where + ' Kampf');
      if (!(m.kampf.chance > 0 && m.kampf.chance < 0.5)) E(where + ': Kampf-Chance ungültig');
      if (!m.tiles.some(r => [...r].some(ch => DATA.tiles[ch] && DATA.tiles[ch].kampf))) E(where + ': Kämpfe eingestellt, aber kein Tiefschnee');
      (m.kampf.gruppen || []).forEach(g => { if (!DATA.kampf.gruppen[g.g]) E(where + ': Kampf-Gruppe „' + g.g + '“ fehlt'); else kampfRegel(g.g, m.kampf.if, g.ab, where + ' Kampf ' + g.g); });
    }
    (m.doors || []).forEach((d, i) => {
      const t = maps[d.to];
      if (!t) return E(where + ': Tür ' + i + ' führt zu fehlender Karte „' + d.to + '“');
      if (!inB(d.x, d.y)) E(where + ': Tür ' + i + ' außerhalb');
      if (tileSolid(t, d.tx, d.ty)) E(where + ': Tür ' + i + ' endet in einer Wand von ' + d.to);
      if (doorAt(t, d.tx, d.ty)) E(where + ': Tür ' + i + ' endet direkt auf einer Tür');
    });
  });

  // Rätsel (Reihenfolge)
  Object.keys(DATA.puzzles).forEach(id => {
    const P = DATA.puzzles[id];
    if (P.fragen) { P.fragen.forEach((f, i) => { if (!f.text || !(f.stunde >= 1 && f.stunde <= 12)) E('Uhr-Rätsel ' + id + ' Frage ' + (i + 1) + ' ungültig'); }); return; }
    if (!Array.isArray(P.order) || !P.order.length) return E('Rätsel ' + id + ': Reihenfolge fehlt');
    if (!Array.isArray(P.notes) || P.notes.length < Math.max.apply(null, P.order)) E('Rätsel ' + id + ': zu wenige Töne');
    P.order.forEach(v => setFlags.add(id + '_' + v));
    checkAction(P.win, 'Rätsel ' + id + ' Sieg'); checkAction(P.fail, 'Rätsel ' + id + ' Fehler');
  });

  // Erreichbarkeit: vom Start über Türen alle Karten, Figuren und Objekte.
  // Bedingte Objekte/Figuren (z. B. Geheimgang-Steine) gelten als wegräumbar.
  const ctx = { flags: {}, day: 24, done: [], followers: Object.keys(chars) };
  const blockedAt = (m, x, y) => tileSolid(m, x, y) ||
    (m.objects || []).some(o => !o.if && objSolid(o) && objCovers(o, x, y)) ||
    (m.npcs || []).some(n => !n.if && n.x === x && n.y === y);
  const seen = {}; Object.keys(maps).forEach(k => { seen[k] = new Set(); });
  const queue = [[DATA.welt.start.map, DATA.welt.start.x, DATA.welt.start.y]];
  while (queue.length) {
    const [mid, x, y] = queue.pop(), m = maps[mid];
    if (!m || seen[mid].has(x + ',' + y)) continue;
    seen[mid].add(x + ',' + y);
    const d = doorAt(m, x, y);
    if (d && maps[d.to]) { queue.push([d.to, d.tx, d.ty]); continue; }
    Object.values(DIRS).forEach(([dx, dy]) => {
      const nx = x + dx, ny = y + dy;
      if (!blockedAt(m, nx, ny) && !seen[mid].has(nx + ',' + ny)) queue.push([mid, nx, ny]);
    });
  }
  const nearReach = (mid, cells) => cells.some(([x, y]) => Object.values(DIRS).some(([dx, dy]) => seen[mid].has((x + dx) + ',' + (y + dy))) || seen[mid].has(x + ',' + y));
  Object.keys(maps).forEach(mid => {
    const m = maps[mid];
    if (!seen[mid].size) return E('Karte ' + mid + ' ist nicht erreichbar');
    (m.doors || []).forEach((d, i) => { if (!seen[mid].has(d.x + ',' + d.y)) E('Karte ' + mid + ': Tür ' + i + ' ist nicht erreichbar'); });
    (m.npcs || []).forEach(n => { if (!nearReach(mid, [[n.x, n.y]])) E('Karte ' + mid + ': ' + n.char + ' ist nicht erreichbar'); });
    (m.secrets || []).forEach(s => { if (!nearReach(mid, [[s.x, s.y]])) E('Karte ' + mid + ': Geheimnis ' + s.id + ' ist nicht erreichbar'); });
    (m.objects || []).forEach(o => {
      if (!o.talk) return;
      const t = DATA.objects[o.type], cells = [];
      for (let yy = 0; yy < t.h; yy++) for (let xx = 0; xx < t.w; xx++) cells.push([o.x + xx, o.y + yy]);
      if (!nearReach(mid, cells)) E('Karte ' + mid + ': Objekt ' + o.type + ' ist nicht erreichbar');
    });
  });

  Object.keys(DATA.karte.orte).forEach(k => { if (!maps[k]) E('Schlosskarte: Ort „' + k + '“ gibt es nicht'); });
  Object.keys(DATA.kampf.gegner).forEach(id => { const T = DATA.kampf.gegner[id]; ['name', 'angriffe', 'treffer', 'besiegt', 'hinweis', 'aussetzen', 'ausgewichen'].forEach(f => { if (!T[f]) E('Gegner ' + id + ': ' + f + ' fehlt'); }); });
  Object.keys(DATA.zauber).forEach(z => { if (!(DATA.zauber[z].tag >= 1 && DATA.zauber[z].tag <= 24)) E('Zauber ' + z + ': Lerntag fehlt'); });

  // Quests: jeder Schritt muss irgendwo gesetzt werden können
  const days = {};
  Object.keys(DATA.quests).forEach(id => {
    const q = DATA.quests[id];
    if (!(q.day >= (q.neben ? 0 : 1) && q.day <= 24)) E('Quest ' + id + ': Tag ungültig');
    if (!q.neben) { if (days[q.day]) E('Quest ' + id + ': Tag ' + q.day + ' doppelt'); days[q.day] = id; }
    if (!q.neben && !q.fragment) E('Quest ' + id + ': Fragment fehlt');
    if (!q.title || !Array.isArray(q.steps) || !q.steps.length) E('Quest ' + id + ': Titel oder Schritte fehlen');
    if (q.start) checkDialogRef(q.start, 'Quest ' + id);
    (q.steps || []).forEach(st => stepFlags(st).forEach(f => { const m = /^zauber_(\w+)$/.exec(f); if (m && DATA.zauber[m[1]] && DATA.zauber[m[1]].tag !== q.day) E('Quest ' + id + ': ' + DATA.zauber[m[1]].name + ' wird an Tag ' + q.day + ' gelernt, laut zauber.json aber an Tag ' + DATA.zauber[m[1]].tag); }));
    (q.steps || []).forEach((st, i) => stepFlags(st).forEach(f => {
      if (!setFlags.has(f)) {
        if (q.teilweise) Wn('Quest ' + id + ' Schritt ' + (i + 1) + ' (' + f + ') ist noch nicht baubar – Quest als „teilweise“ markiert');
        else E('Quest ' + id + ' Schritt ' + (i + 1) + ': Flag „' + f + '“ wird nirgends gesetzt – nicht abschließbar');
      }
    }));
    if (q.teilweise) Wn('Quest ' + id + ' ist noch nicht vollständig gebaut');
  });
  return { errors, warnings };
}

// ===== Pixel-Werkzeuge: alle Grafiken werden im Code gemalt =====
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function srand(seed) { let s = (seed | 0) % 2147483647; if (s <= 0) s += 2147483646; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }

function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgbHex(r, g, b) { return '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join(''); }
// Farbe aufhellen (amt > 0) oder abdunkeln (amt < 0)
function shade(h, amt) {
  const [r, g, b] = hexRgb(h);
  return amt >= 0 ? rgbHex(r + (255 - r) * amt, g + (255 - g) * amt, b + (255 - b) * amt) : rgbHex(r * (1 + amt), g * (1 + amt), b * (1 + amt));
}

// Mal-Pinsel für einen Canvas-Kontext
function Pen(g) {
  return {
    g,
    r(x, y, w, h, c) { if (w <= 0 || h <= 0) return; g.fillStyle = c; g.fillRect(x | 0, y | 0, w | 0, h | 0); },
    px(x, y, c) { g.fillStyle = c; g.fillRect(x | 0, y | 0, 1, 1); },
    ell(cx, cy, rx, ry, c) {
      g.fillStyle = c;
      for (let y = -ry; y <= ry; y++) {
        const w = Math.round(rx * Math.sqrt(Math.max(0, 1 - (y * y) / ((ry + 0.4) * (ry + 0.4)))));
        if (w > 0) g.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2, 1);
      }
    },
    circ(cx, cy, rad, c) { this.ell(cx, cy, rad, rad, c); },
    // Senkrechter Farbverlauf in Stufen (Pixel-Look)
    vgrad(x, y, w, h, c1, c2, steps) {
      steps = steps || 4;
      const [a, b, d] = hexRgb(c1), [e, f, k] = hexRgb(c2);
      for (let i = 0; i < steps; i++) {
        const t = i / (steps - 1 || 1), y0 = y + Math.round(h * i / steps), y1 = y + Math.round(h * (i + 1) / steps);
        this.r(x, y0, w, y1 - y0, rgbHex(a + (e - a) * t, b + (f - b) * t, d + (k - d) * t));
      }
    },
    // Linie (Bresenham)
    line(x0, y0, x1, y1, c) {
      g.fillStyle = c; x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0;
      const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
      let err = dx + dy;
      for (;;) { g.fillRect(x0, y0, 1, 1); if (x0 === x1 && y0 === y1) break; const e2 = 2 * err; if (e2 >= dy) { err += dy; x0 += sx; } if (e2 <= dx) { err += dx; y0 += sy; } }
    },
  };
}

// Dunkle Kontur um alle sichtbaren Pixel (bessere Lesbarkeit der Figuren)
function outline(c, col) {
  const g = c.getContext('2d'), w = c.width, h = c.height, d = g.getImageData(0, 0, w, h).data, add = [];
  const op = (x, y) => x >= 0 && y >= 0 && x < w && y < h && d[(y * w + x) * 4 + 3] > 40;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++)
    if (!op(x, y) && (op(x - 1, y) || op(x + 1, y) || op(x, y - 1) || op(x, y + 1))) add.push(x, y);
  g.fillStyle = col;
  for (let i = 0; i < add.length; i += 2) g.fillRect(add[i], add[i + 1], 1, 1);
}

// ===== Kacheln (32×32) =====
// nb: Nachbarzeichen { up, down, left, right } und Kachelposition { x, y }
const isWallCh = ch => ch === 'W' || ch === 'D' || ch === 'X';

function planks(p, R, nb, cols) {
  for (let r = 0; r < 4; r++) {
    const y = r * 8, base = cols[(R() * cols.length) | 0];
    p.r(0, y, 32, 8, base);
    p.r(0, y, 32, 1, shade(base, 0.12));
    p.r(0, y + 7, 32, 1, shade(base, -0.38));
    const seam = (nb.x * 13 + nb.y * 7 + r * 11) % 32;
    p.r(seam, y, 1, 7, shade(base, -0.38));
    p.px(seam + 1, y + 1, shade(base, 0.15));
    for (let i = 0; i < 3; i++) p.r((R() * 28) | 0, y + 2 + ((R() * 4) | 0), 2 + ((R() * 4) | 0), 1, shade(base, -0.12));
    if (R() < 0.25) { const kx = (R() * 28) | 0; p.r(kx, y + 3, 2, 2, shade(base, -0.3)); }
  }
}

const PAINT_TILE = {
  decke(p, R, nb) {
    p.r(0, 0, 32, 32, '#1d130e');
    for (let i = 0; i < 6; i++) p.r((R() * 30) | 0, (R() * 30) | 0, 2, 1, '#261a12');
    const trim = (ch) => ch && ch !== 'T';
    if (trim(nb.down)) { p.r(0, 27, 32, 5, '#4a2c18'); p.r(0, 27, 32, 1, '#7a4c2c'); p.r(0, 31, 32, 1, '#24160c'); }
    if (trim(nb.up)) { p.r(0, 0, 32, 4, '#3a2214'); p.r(0, 0, 32, 1, '#6a4428'); }
    if (trim(nb.right)) { p.r(28, 0, 4, 32, '#3a2214'); p.r(28, 0, 1, 32, '#24160c'); p.r(31, 0, 1, 32, '#5a3820'); }
    if (trim(nb.left)) { p.r(0, 0, 4, 32, '#3a2214'); p.r(3, 0, 1, 32, '#24160c'); p.r(0, 0, 1, 32, '#5a3820'); }
  },
  wand_putz(p, R, nb) {
    const lower = !isWallCh(nb.down), top = nb.up === 'T';
    // Putz, warmes Creme
    p.r(0, 0, 32, 32, '#d2b083');
    for (let i = 0; i < 14; i++) p.px((R() * 32) | 0, (R() * 32) | 0, R() < 0.5 ? '#c4a174' : '#dcbd92');
    if (top) { p.r(0, 0, 32, 7, '#4a2c18'); p.r(0, 6, 32, 1, '#2e1a0e'); p.r(0, 1, 32, 1, '#6e4428'); p.r(0, 7, 32, 2, '#b8956a'); }
    if (lower) {
      // Holzvertäfelung mit Feldern
      p.r(0, 11, 32, 21, '#7a4a2a');
      p.r(0, 11, 32, 2, '#5a341c'); p.r(0, 11, 32, 1, '#9a6a42');
      p.r(3, 15, 26, 12, '#6c4024'); p.r(3, 15, 26, 1, '#4e2e18'); p.r(3, 26, 26, 1, '#94643c'); p.r(28, 15, 1, 12, '#94643c'); p.r(3, 15, 1, 12, '#4e2e18');
      p.r(0, 28, 32, 4, '#3e2414'); p.r(0, 28, 32, 1, '#6a4428');
    }
  },
  dielen(p, R, nb) { planks(p, R, nb, ['#94603a', '#8c5a35', '#9a663d', '#905d37']); },
  galerie(p, R, nb) { planks(p, R, nb, ['#a2703f', '#9a6a3c', '#a87543']); },
  galerie_front(p, R, nb) {
    planks(p, R, nb, ['#a2703f', '#9a6a3c']);
    p.r(0, 13, 32, 19, '#5c361e');
    p.r(0, 13, 32, 2, '#8a5a34'); p.r(0, 15, 32, 1, '#3e2414');
    for (let x = 2; x < 32; x += 16) { p.r(x, 18, 12, 10, '#4e2c18'); p.r(x, 18, 12, 1, '#3a2010'); p.r(x, 27, 12, 1, '#74482a'); p.r(x + 11, 18, 1, 10, '#74482a'); }
    p.r(0, 30, 32, 2, '#2e1a0e');
    // Geländer
    for (let x = 1; x < 32; x += 6) { p.r(x, 2, 2, 11, '#6e4226'); p.px(x, 2, '#9a6a42'); }
    p.r(0, 0, 32, 3, '#7a4a2a'); p.r(0, 0, 32, 1, '#b07a48');
  },
  galerie_seite(p, R, nb) {
    planks(p, R, nb, ['#94603a', '#8c5a35', '#9a663d']);
    p.r(0, 0, 11, 32, '#5c361e'); p.r(9, 0, 2, 32, '#3a2010'); p.r(0, 0, 2, 32, '#7a4a2a');
    for (let y = 3; y < 32; y += 10) { p.r(3, y, 5, 6, '#4e2c18'); p.r(3, y, 5, 1, '#74482a'); }
    p.r(11, 0, 5, 32, 'rgba(0,0,0,0.22)');
  },
  treppe(p) {
    for (let i = 0; i < 4; i++) {
      const y = i * 8, t = shade('#a06a40', -i * 0.06);
      p.r(0, y, 32, 5, t); p.r(0, y, 32, 1, shade(t, 0.2)); p.r(0, y + 5, 32, 3, '#5e3820');

    p.r(0, 0, 3, 32, '#4a2c18'); p.r(29, 0, 3, 32, '#4a2c18'); p.r(1, 0, 1, 32, '#6e4428'); p.r(30, 0, 1, 32, '#6e4428');
  },
  wand_stein(p, R, nb) {
    p.r(0, 0, 32, 32, '#3a3340');
    for (let row = 0; row < 4; row++) {
      const y = row * 8, off = (row + nb.y) % 2 ? 8 : 0;
      for (let x = -off; x < 32; x += 16) {
        const c = ['#6e6472', '#675d6b', '#746a78'][(R() * 3) | 0];
        p.r(x + 1, y + 1, 14, 6, c); p.r(x + 1, y + 1, 14, 1, shade(c, 0.15)); p.r(x + 1, y + 6, 14, 1, shade(c, -0.2));
      }
    }
    if (nb.up === 'T') { p.r(0, 0, 32, 4, '#2a2430'); }
    if (!isWallCh(nb.down)) { p.r(0, 26, 32, 6, '#2e2834'); p.r(0, 26, 32, 1, '#4e4652'); }
  },
  steinboden(p, R, nb) {
    p.r(0, 0, 32, 32, '#3a3440');
    for (let i = 0; i < 4; i++) {
      const x = (i % 2) * 16 + ((nb.y % 2) && i < 2 ? 0 : 0), y = (i >> 1) * 16;
      const c = ['#5c5560', '#635b66', '#575060', '#605864'][(R() * 4) | 0];
      p.r(x + 1, y + 1, 14, 14, c); p.r(x + 1, y + 1, 14, 1, shade(c, 0.14)); p.r(x + 1, y + 1, 1, 14, shade(c, 0.08));
      if (R() < 0.4) p.r(x + 3 + ((R() * 8) | 0), y + 4 + ((R() * 8) | 0), 3, 1, shade(c, -0.2));
    }
  },
  ausgang_unten(p, R, nb) {
    PAINT_TILE.steinboden(p, R, nb);
    p.r(4, 2, 24, 12, '#4f6b2a'); p.r(5, 3, 22, 10, '#e09a2c'); p.r(7, 5, 18, 6, '#4f6b2a');
    for (let y = 16; y < 32; y += 2) p.r(0, y, 32, 2, 'rgba(10,6,12,' + ((y - 14) / 22).toFixed(2) + ')');
  },
};

// ---- src/engine/paint_objects.js ----
// ===== Objekte und Möbel =====
// Aufruf: PAINT_OBJ[name](p, f, R, W, H) – Leinwand W×H, Grundfläche liegt unten (H - h*32 ist der Überstand nach oben)

function flame(p, x, y, f, big) {
  const h = (big ? 7 : 5) + [0, 1, -1, 1][f % 4];
  const sway = [0, 1, 0, -1][f % 4];
  p.r(x - 1, y - h + 2, 3, h - 1, '#ff9a2a');
  p.r(x - 1 + sway, y - h, 2, 3, '#ffd36a');
  p.r(x, y - h + 3, 1, h - 3, '#fff2b0');
}
function bookRow(p, R, x0, x1, yBase, hMax) {
  const cols = ['#8a2a2a', '#2a4a8a', '#3a6a3a', '#8a6a2a', '#5a2a6a', '#2a6a6a', '#a0522d', '#d0b080', '#6a1e1e', '#e09a2c'];
  let x = x0;
  while (x < x1 - 2) {
    const w = 2 + ((R() * 3) | 0), h = hMax - ((R() * 5) | 0), c = cols[(R() * cols.length) | 0];
    if (x + w > x1) break;
    if (R() < 0.08 && x + 6 < x1) { // schräg liegendes Buch
      for (let i = 0; i < 5; i++) p.r(x + i, yBase - 3 - i, 3, 3, c);
      x += 7; continue;
    }
    p.r(x, yBase - h, w, h, c); p.r(x, yBase - h, 1, h, shade(c, 0.2)); p.r(x + w - 1, yBase - h, 1, h, shade(c, -0.3));
    if (R() < 0.5) p.r(x, yBase - h + 2, w, 1, '#e8c050');
    x += w + (R() < 0.15 ? 1 : 0);
  }
}

const PAINT_OBJ = {
  kamin(p, f, R) {

function stoneBlocks(p, R, nb, cols, mortar) {
  p.r(0, 0, 32, 32, mortar);
  for (let row = 0; row < 4; row++) {
    const y = row * 8, off = (row + nb.y) % 2 ? 8 : 0;
    for (let x = -off; x < 32; x += 16) {
      const c = cols[(R() * cols.length) | 0];

    }
  }
}

// ===== Eingabe: Steuerkreuz, A, B, Menü – Touch und Tastatur =====
const IN = {
  held: [], presses: [],
  press(k) {
    if (DIRS[k]) { if (this.held.indexOf(k) < 0) this.held.push(k); }
    this.presses.push(k);
  },
  release(k) { const i = this.held.indexOf(k); if (i >= 0) this.held.splice(i, 1); },
  dir() { return this.held.length ? this.held[this.held.length - 1] : null; },
  take(k) { const i = this.presses.indexOf(k); if (i >= 0) { this.presses.splice(i, 1); return true; } return false; },
  clear() { this.presses.length = 0; },

  init() {
    const KMAP = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right',
      Enter: 'a', ' ': 'a', z: 'a', y: 'a', x: 'b', Backspace: 'b', Escape: 'menu', m: 'menu' };
    addEventListener('keydown', e => {
      const k = KMAP[e.key]; if (!k) return;
      if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
      e.preventDefault(); if (!e.repeat) this.press(k);
    });
    addEventListener('keyup', e => { const k = KMAP[e.key]; if (k) this.release(k); });
    addEventListener('blur', () => { this.held.length = 0; });

    // Steuerkreuz: Richtung aus der Lage zum Mittelpunkt
    const dpad = document.getElementById('dpad'), arrows = {};
    dpad.querySelectorAll('.ar').forEach(el => { arrows[el.dataset.d] = el; });
    let padDir = null;
    const setPad = d => {
      if (d === padDir) return;
      if (padDir) { this.release(padDir); arrows[padDir].classList.remove('on'); }
      padDir = d;
      if (d) { this.press(d); arrows[d].classList.add('on'); }
    };
    const padPos = e => {
      const r = dpad.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
      if (Math.hypot(dx, dy) < r.width * 0.1) return setPad(null);
      setPad(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    };
    dpad.addEventListener('pointerdown', e => { e.preventDefault(); try { dpad.setPointerCapture(e.pointerId); } catch (_) {} padPos(e); });
    dpad.addEventListener('pointermove', e => { if (padDir || e.buttons) padPos(e); });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => dpad.addEventListener(n, () => setPad(null)));

    [['bA', 'a'], ['bB', 'b'], ['bMenu', 'menu']].forEach(([id, k]) => {
      const el = document.getElementById(id);
      el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); try { el.setPointerCapture(e.pointerId); } catch (_) {} this.press(k); el.classList.add('on'); });
      ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => el.addEventListener(n, () => { this.release(k); el.classList.remove('on'); }));
    });
    // Zoomen, Scrollen und Lupe auf dem iPad unterdrücken (außer im Code-Fenster)
    ['touchstart', 'touchmove', 'touchend', 'gesturestart', 'dblclick', 'contextmenu'].forEach(n => document.addEventListener(n, e => {
      if (e.target && e.target.closest && e.target.closest('#panel')) return;
      if (e.cancelable) e.preventDefault();
    }, { passive: false }));
  },
};

// ===== Dialogbox mit Schreibmaschinen-Effekt =====
const DLG = {
  pages: [], idx: 0, shown: 0, cb: null, blipAt: 0,
  get open() { return this.pages.length > 0; },
  // lines: [[sprecher, text], ...]; Sprecher '' = Erzähler
  show(lines, cb) {
    const pages = [];
    lines.forEach(([sp, tx]) => {
      const name = sp ? (DATA.characters[sp] || { name: sp }).name : '';
      const wrapped = R.wrap(tx, 470, 15, 500);
      for (let i = 0; i < wrapped.length; i += 3) pages.push({ name, sp, lines: wrapped.slice(i, i + 3) });
    });
    this.pages = pages; this.idx = 0; this.shown = 0; this.cb = cb || null;
  },
  pageLen() { return this.pages[this.idx].lines.join(' ').length; },
  update(dt) {
    if (!this.open) return;
    const before = Math.floor(this.shown);
    this.shown = Math.min(this.pageLen(), this.shown + dt * 55);
    if (Math.floor(this.shown) > before && Math.floor(this.shown) % 5 === 0) AU.sfx('blip');
    if (IN.take('a') || IN.take('b')) {
      if (this.shown < this.pageLen()) { this.shown = this.pageLen(); return; }
      this.idx++; this.shown = 0;
      if (this.idx >= this.pages.length) { const cb = this.cb; this.pages = []; this.cb = null; if (cb) cb(); }
    }
  },
  draw(time) {
    if (!this.open) return;
    const pg = this.pages[this.idx], c = R.ctx, x = 10, y = 286, w = VIEW_W - 20, h = 90;
    R.panel(x, y, w, h, 0.95);
    if (pg.name) {
      c.font = '700 13px ' + R.FONT; const nw = c.measureText(pg.name).width + 20;
      R.panel(x + 12, y - 18, nw, 22, 1); R.text(pg.name, x + 22, y - 2, { size: 13, weight: 700, color: '#ffd36a' });
    }
    let left = Math.floor(this.shown);
    pg.lines.forEach((ln, i) => {
      const part = ln.slice(0, Math.max(0, left)); left -= ln.length + 1;
      R.text(part, x + 16, y + 27 + i * 21, { size: 15, weight: 500, color: pg.name ? '#f8f0e0' : '#e8dcc4' });
    });
    if (this.shown >= this.pageLen() && Math.floor(time * 3) % 2) { c.fillStyle = '#ffd36a'; c.fillRect(x + w - 22, y + h - 16, 9, 3); c.fillRect(x + w - 20, y + h - 13, 5, 2); c.fillRect(x + w - 19, y + h - 11, 3, 2); }
  },
};

  },
  sterne(x, y, time) {

  // Zauberstab in Charlys Hand; beim Zaubern erhoben, Funken sprühen aus der Spitze

    p.r(x - 7, y - 26, 14, 10, '#6a6a7a'); p.r(x - 7, y - 26, 14, 2, '#9a9aaa'); p.r(x + 7, y - 24, 4, 2, '#6a6a7a'); p.r(x - 9, y - 30, 18, 1, '#3a3a44');

      for (let i = 0; i < 3; i++) { c.globalAlpha = 0.6; c.fillStyle = '#ffffff'; c.fillRect(x + 2 + i * 3, y - 4 - ((this.evT * 14 + i * 4) % 10), 1, 3); c.globalAlpha = 1; }
