suchen. B: Diego schnüffeln lassen. ☰ oben rechts: Menü und Questlog."]],"q01_start":[["","1. Dezember. Über Nacht ist Løvestein unter einer dicken Schneedecke verschwunden."],["joern","Charly … riechst du das auch? Wie Glut und Schnee gleichzeitig."],["","Am Rand des Kamins glitzert Raureif. Mitten in der Wärme."],["joern","Das ist doch nicht normal. Vielleicht findet Diego heraus, was da los ist."]],"diego_wecken":[["","Diego schnarcht leise. Charly krault ihn hinter den Ohren."],["diego","Wuff?"],["","Diego streckt sich, gähnt ausgiebig – und weicht Charly ab jetzt nicht mehr von der Seite."],["","Tipp: Drück B, dann schnüffelt Diego nach Geheimnissen in der Nähe. Goldene Pfotenspuren zeigen den Weg."]],"diego_1":[["","Diego wedelt so heftig, dass sein ganzer Hintern mitwackelt."]],"diego_2":[["","Diego schaut dich an, als hätte er seit Stunden nichts gegessen. Hat er aber."]],"diego_3":[["diego","Wuff!"],["","Diego stupst dich mit der Nase an. Schnüffeln? (Taste B)"]],"diego_kein_geruch":[["","Diego schnüffelt eifrig am Boden … aber hier riecht nichts Besonderes."]],"diego_nicht_da":[["","Diego ist gerade nicht bei dir. Vielleicht schläft er noch im Körbchen am Kamin?"]],"joern_vor1":[["joern","Noch {tage} Tage, dann beginnt der Advent. Ich hab das Gefühl, dieses Jahr passiert hier etwas Besonderes."]],"joern_vor2":[["joern","Ich hab Frieda vorhin beim Laufrad-Marathon zugeschaut. Die ist fitter als ich."]],"joern_vor3":[["joern","Weißt du, was das Beste am Winter in Løvestein ist? Dass wir ihn zusammen erleben."]],"joern_1":[["joern","Wenn du mich brauchst: Ich bin direkt hinter dir. Wie immer."]],"joern_2":[["joern","Noch eine Tasse Kakao, und ich schlafe vor dem Kamin ein. Neben Diego."]],"joern_3":[["joern","Hörst du das? Das Schloss knarrt, als würde es sich im Schlaf umdrehen."]],"joern_q01_tipp":[["joern","Der Raureif am Kamin lässt mir keine Ruhe. Diego hat die beste Nase im ganzen Schloss – lass ihn mal schnüffeln."]],"q01_joern":[["joern","Eine Feder? Die ist ja … warm. Mitten im Winter."],["joern","Schau, sie glimmt wie Glut. So einen Vogel gibt es hier doch gar nicht."],["","An der Feder hängen feine Raureif-Kristalle. Sie glitzern in Richtung Tür."],["joern","Lotte Silberfeder weiß bestimmt, was das ist. Sie sitzt sicher wieder in der Großen Halle über ihren Büchern."]],"q01_joern_danach":[["joern","Die Raureif-Spur führt hinaus in den Gang. Komm, wir folgen ihr!"]],"q01_feder_fund":[["","Diego bellt den Kamin an. Hinter einem losen Ziegel steckt … eine Feder!"],["","Sie schimmert golden-weiß und fühlt sich warm an, obwohl ringsum Raureif glitzert."],["","Charly hat die Winterfeder gefunden."]],"geheim_zimtstern":[["","Hinter dem Farn liegt ein Zimtstern – noch ganz knusprig!"],["","Diego bekommt die Hälfte. Mindestens."]],"geheim_notiz":[["","Hinter einem losen Stein steckt ein vergilbter Zettel:"],["","„Wer das hier findet, hat einen sehr guten Hund. – Ein Schüler aus Bernfuchs, vor langer, langer Zeit.“"]],"pit_1":[["pit","Hey Charly! Ich lese gerade „Wintermagie für Anfänger“. Kapitel eins: Nie die Zunge an einen Eiszapfen halten."]],"pit_2":[["pit","Hast du das auch gemerkt? Seit heute Nacht flackern alle Kerzen im Schloss so komisch."]],"frieda":[["","Frieda rennt in ihrem Laufrad, als gäbe es kein Morgen."],["frieda","Piep!"],["","Sie stopft sich die Backen voll und schaut dich mit glänzenden Knopfaugen an."]],"kamin":[["","Das Feuer knistert. Es riecht nach Tannenzapfen und ein bisschen nach Zimt."]],"kamin_q01":[["","Am Rand des Kamins glitzert Raureif – direkt neben den Flammen. Diego könnte schnüffeln (Taste B)."]],"fenster":[["","Draußen tanzen dicke Schneeflocken. In der Ferne glitzert der Spiegelsee im Mondlicht."]],"regal_1":[["","„Hundert Arten, Tee zu kochen“, „Rätsel für lange Winterabende“ … und ganz hinten ein Buch, das leise summt."]],"regal_2":[["","„Moosgrün und Bernstein – Die Geschichte des Hauses Bernfuchs“. Auf dem Rücken klebt ein Hundehaar."]],"banner":[["","Das Banner des Hauses Bernfuchs: ein Fuchs auf Moosgrün und Bernstein. Darunter steht: „Treu und warm.“"]],"wanduhr":[["","Die Wanduhr tickt gemütlich. Ihr Pendel schwingt im Takt des Kaminfeuers."]],"tannenbaum":[["","Ein kleiner Tannenbaum mit Strohsternen. Jemand hat einen Hundekeks als Schmuck aufgehängt. Diego hat ihn schon im Blick."]],"sofa":[["","Das gemütlichste Sofa im ganzen Schloss. Leider ist Diego der gleichen Meinung."]],"tisch":[["","Ein Adventskranz aus Tannenzweigen. Daneben dampfen zwei Tassen Kakao – eine mit extra viel Sahne."]],"sessel":[["","Ein weicher Lesesessel. Die Delle im Polster hat genau Charlys Form."]],"lampe":[["","Die Stehlampe verbreitet warmes, honiggelbes Licht."]],"kommode":[["","In der Kommode: Wollsocken, Strickmützen und eine Dose Hundekekse. Diego sitzt sofort daneben."]],"buecher":[["","Ein wackeliger Bücherstapel. Ganz oben: „Pfotenkunde für Fortgeschrittene“."]],"pflanze":[["","Eine Zimmerpflanze. Sie hat sich zum Kamin gedreht, um es warm zu haben."]],"ottokar":[["ottokar","Chrrr … pfffh … chrrr …"],["","Sir Ottokar der Schnarcher schläft in seinem Goldrahmen. Wie immer."]],"ruestung":[["","Eine alte Ritterrüstung. Als Charly vorbeigeht, quietscht das Visier ganz leise."]],"bank":[["","Eine Holzbank. In die Lehne hat jemand einen kleinen Fuchs geschnitzt."]],"wandkerze":[["","Eine Kerze in einem eisernen Halter. Die Flamme neigt sich zur Treppe hin, als wehe von oben ein kalter Wind."]],"treppe_vor":[["","Die Treppe hinauf zum Schlosskern. Oben ist es noch still – ab dem 1. Dezember geht es hier weiter."]],"treppe_bald":[["","Ein kalter Luftzug weht von oben herab. Die Treppe ist noch zugeschneit. Hier geht es bald weiter."]]},"quests":{"Q01":{"day":1,"title":"Die letzte Winterfeder","start":"q01_start","teilweise":true,"fragment":"Wenn die längste Nacht sich naht, sucht der Phönix sein Feuer.","steps":[{"flag":"diego_dabei","text":"Weck Diego in seinem Körbchen am Kamin."},{"flag":"q01_feder","text":"Am Kamin glitzert Raureif. Lass Diego sch const SAVE_VERSION = 1;
const SAVE_KEY = 'winterphoenix_save';
const TEST_KEY = 'winterphoenix_test';

const isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);

// Kleiner, stabiler Prüfwert für Export-Codes
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36);
}
function utf8ToB64(s) {
  const bytes = new TextEncoder().encode(s); let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64ToUtf8(b) {
  const bin = atob(b); const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

// ===== Tagesfreischaltung (Europe/Berlin) =====
const SEASON_YEAR = 2026;

function berlinDate(now) {
  const parts = new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Europe/Berlin', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
  }).formatToParts(now);
  const o = {};
  parts.forEach(p => { if (p.type !== 'literal') o[p.type] = parseInt(p.value, 10); });
  return { y: o.year, m: o.month, d: o.day, h: o.hour % 24, min: o.minute };
}

// 0 = vor dem 1. Dezember, 1..24 = freigeschaltete Tage, ab 24.12. bleibt alles offen
function unlockedDay(now) {
  const b = berlinDate(now);
  if (b.y > SEASON_YEAR) return 24;
  if (b.y < SEASON_YEAR || b.m < 12) return 0;
  return Math.min(24, b.d);
}

function daysUntilStart(now) {
  if (unlockedDay(now) > 0) return 0;
  const b = berlinDate(now);
  const a = Date.UTC(b.y, b.m - 1, b.d), s = Date.UTC(SEASON_YEAR, 11, 1);
  return Math.max(0, Math.round((s - a) / 864e5));
}

// ?testtag=N (0..24) -> Zahl, sonst null
function parseTestDay(search) {
  const m = /[?&]testtag=(\d{1,2})(?:&|$)/.exec(search || '');
  if (!m) return null;
  const n = parseInt(m[1], 10);
  return n >= 0 && n <= 24 ? n : null;
}

// ---- src/core/conditions.js ----
// ===== Bedingungen und Aktionen aus den Daten =====
// Bedingungen: "flag:x", "day>=3", "quest:Q01" (offen und aktiv), "done:Q01",
// "follower:diego". Ein "!" davor kehrt um.
// ctx: { flags, day, done[], followers[] }

function questIsActive(id, ctx) {
  const q = DATA.quests[id];
  return !!q && q.day <= ctx.day && ctx.done.indexOf(id) < 0;
}

function checkCond(c, ctx) {
  if (typeof c !== 'string') return false;
  if (c[0] === '!') return !checkCond(c.slice(1), ctx);
  let m;
  if ((m = /^flag:(\w+)$/.exec(c))) return !!ctx.flags[m[1]];
  if ((m = /^day>=(\d+)$/.exec(c))) return ctx.day >= +m[1];
  if ((m = /^day<(\d+)$/.exec(c))) return ctx.day < +m[1];
  if ((m = /^quest:(\w+)$/.exec(c))) return questIsActive(m[1], ctx);
  if ((m = /^done:(\w+)$/.exec(c))) return ctx.done.indexOf(m[1]) >= 0;
  if ((m = /^follower:(\w+)$/.exec(c))) return ctx.followers.indexOf(m[1]) >= 0;
  return false;
}
const COND_RE = /^!?(flag:\w+|day>=\d+|day<\d+|quest:\w+|done:\w+|follower:\w+)$/;

function condsOk(list, ctx) { return !list || list.every(c => checkCond(c, ctx)); }

// Erste passende Gesprächs-/Untersuchen-Regel aus einer Liste
function pickTalk(list, ctx) {
  if (!Array.isArray(list)) return null;
  for (const t of list) if (condsOk(t.if, ctx)) return t;
  return null;
}

// ---- src/core/save.js ----
// ===== Spielstand: Format, Migration, Speicher, Export =====
// Regel: Ein Update darf einen Spielstand nie löschen. Unbekannte Felder bleiben erhalten.

function newSave(now) {
  const s = DATA.welt.start;
  return {
    v: SAVE_VERSION, created: now, updated: now,
    map: s.map, x: s.x, y: s.y, dir: s.dir,
    flags: {}, done: [], fragments: [], secrets: [],
    followers: ['joern'], seenDay: 0, playMs: 0,
  };
}

// Migrationen: MIGRATIONS[n] macht aus Version n die Version n+1
const MIGRATIONS = {
  // v0 = Vorab-Format (nur zum Test der Migrationskette): {version:0, pos:{map,x,y}, flags}
  0: d => {
    const out = Object.assign({}, d);
    out.v = 1;
    if (isObj(d.pos)) { out.map = d.pos.map; out.x = d.pos.x; out.y = d.pos.y; }
    delete out.pos; delete out.version;
    return out;
  },
};

// Liefert {save, warnings} oder null, wenn gar nichts zu retten ist
function migrateSave(raw) {
  if (!isObj(raw)) return null;
  let d = Object.assign({}, raw);
  const warnings = [];
  let v = isNum(d.v) ? d.v : (isNum(d.version) ? d.version : null);
  if (v === null) return null;
  while (v < SAVE_VERSION) {
    if (!MIGRATIONS[v]) return null;
    d = MIGRATIONS[v](d); v += 1; d.v = v;
    warnings.push('migriert auf v' + v);
  }
  // Neuere Version (z. B. nach einem Zurücksetzen): behalten, nichts herabstufen
  if (v > SAVE_VERSION) warnings.push('Spielstand stammt aus neuerer Version');

  const s = newSave(isNum(d.created) ? d.created : 0);
  const out = Object.assign({}, d);
  out.v = Math.max(v, SAVE_VERSION);
  out.created = isNum(d.created) ? d.created : 0;
  out.updated = isNum(d.updated) ? d.updated : 0;
  out.flags = {};
  if (isObj(d.flags)) Object.keys(d.flags).forEach(k => {
    const val = d.flags[k];
    if (/^\w{1,60}$/.test(k) && (typeof val === 'boolean' || isNum(val))) out.flags[k] = val;
  });
  const strList = a => Array.isArray(a) ? a.filter(x => typeof x === 'string' && x.length < 60) : [];
  out.done = strList(d.done);
  out.fragments = strList(d.fragments);
  out.secrets = strList(d.secrets);
  out.followers = strList(d.followers).filter(f => DATA.characters[f]);
  if (out.followers.indexOf('joern') < 0) out.followers.unshift('joern');
  out.seenDay = isNum(d.seenDay) ? clamp(d.seenDay, 0, 24) : 0;
  out.playMs = isNum(d.playMs) ? d.playMs : 0;
  // Position: unbekannte Karte oder Wand -> sicher zum Start, Fortschritt bleibt
  const m = typeof d.map === 'string' && DATA.maps[d.map];
  const posOk = m && isNum(d.x) && isNum(d.y) && d.x >= 0 && d.y >= 0 && d.y < m.tiles.length && d.x < m.tiles[0].length
    && !(DATA.tiles[m.tiles[d.y][d.x]] || {}).solid;
  if (posOk) { out.map = d.map; out.x = d.x; out.y = d.y; }
  else { out.map = s.map; out.x = s.x; out.y = s.y; warnings.push('Position zurückgesetzt'); }
  out.dir = DIRS[d.dir] ? d.dir : 'down';
  return { save: out, warnings };
}

// st: Objekt mit getItem/setItem (localStorage oder Testattrappe)
function storeLoad(st, key) {
  const tryParse = raw => { try { return migrateSave(JSON.parse(raw)); } catch (e) { return null; } };
  let raw = null;
  try { raw = st.getItem(key); } catch (e) { return { save: null, source: null, broken: false }; }
  if (raw) {
    const r = tryParse(raw);
    if (r) return { save: r.save, warnings: r.warnings, source: 'main', broken: false };
    // Kaputt: Rohdaten aufheben (nie löschen), dann Sicherung versuchen
    try { if (st.getItem(key + '_defekt') !== raw) st.setItem(key + '_defekt', raw); } catch (e) {}
  }
  let braw = null;
  try { braw = st.getItem(key + '_backup'); } catch (e) {}
  if (braw) {
    const r = tryParse(braw);
    if (r) return { save: r.save, warnings: r.warnings, source: 'backup', broken: !!raw };
  }
  return { save: null, source: null, broken: !!raw };
}

function storeWrite(st, key, save) {
  try {
    const old = st.getItem(key);
    // Vorherigen Stand nur dann als Sicherung behalten, wenn er gültig ist
    if (old) { let ok = false; try { ok = !!migrateSave(JSON.parse(old)); } catch (e) {} if (ok) st.setItem(key + '_backup', old); }
    st.setItem(key, JSON.stringify(save));
    return true;
  } catch (e) { return false; }
}

// Export-Code: WP1-<base64>-<prüfwert>
function exportCode(save) {
  const json = JSON.stringify(save);
  return 'WP1-' + utf8ToB64(json) + '-' + hashStr(json);
}
function importCode(code) {
  const c = String(code || '').replace(/\s+/g, '');
  const m = /^WP1-([A-Za-z0-9+/=]+)-([0-9a-z]+)$/.exec(c);
  if (!m) return { error: 'Das ist kein gültiger Spielstand-Code.' };
  let json;
  try { json = b64ToUtf8(m[1]); } catch (e) { return { error: 'Der Code ist beschädigt.' }; }
  if (hashStr(json) !== m[2]) return { error: 'Der Code ist unvollständig oder verändert.' };
  let r = null;
  try { r = migrateSave(JSON.parse(json)); } catch (e) {}
  if (!r) return { error: 'Der Code enthält keinen lesbaren Spielstand.' };
  return { save: r.save };
}

// ---- src/core/world.js ----
// ===== Welt: Karten, Kollision, Wege =====
function mapW(m) { return m.tiles[0].length; }
function mapH(m) { return m.tiles.length; }
function tileChar(m, x, y) {
  if (y < 0 || y >= m.tiles.length || x < 0 || x >= m.tiles[0].length) return null;
  return m.tiles[y][x];
}
function tileSolid(m, x, y) {
  const c = tileChar(m, x, y);
  return c === null || !!(DATA.tiles[c] || {}).solid;
}
function objType(o) { return DATA.objects[o.type]; }
function objCovers(o, x, y) {
  const t = objType(o);
  return x >= o.x && x < o.x + t.w && y >= o.y && y < o.y + t.h;
}
function visibleObjs(m, ctx) { return (m.objects || []).filter(o => condsOk(o.if, ctx)); }
function visibleNpcs(m, ctx) { return (m.npcs || []).filter(n => condsOk(n.if, ctx)); }
function objAt(m, x, y, ctx) { return visibleObjs(m, ctx).find(o => objCovers(o, x, y)) || null; }
function npcAt(m, x, y, ctx) { return visibleNpcs(m, ctx).find(n => n.x === x && n.y === y) || null; }
function spotAt(m, x, y, ctx) { return (m.spots || []).find(s => s.x === x && s.y === y && condsOk(s.if, ctx)) || null; }
function doorAt(m, x, y) { return (m.doors || []).find(d => d.x === x && d.y === y) || null; }
function secretAt(m, x, y, ctx) { return (m.secrets || []).find(s => s.x === x && s.y === y && condsOk(s.if, ctx)) || null; }

function blockedAt(m, x, y, ctx) {
  if (tileSolid(m, x, y)) return true;
  if (visibleObjs(m, ctx).some(o => objType(o).solid && objCovers(o, x, y))) return true;
  if (npcAt(m, x, y, ctx)) return true;
  return false;
}

// Kürzester Weg (Breitensuche) bis auf das Ziel oder direkt daneben (Ziel darf fest sein)
function findPath(m, from, to, ctx, maxLen) {
  const w = mapW(m), h = mapH(m), key = (x, y) => y * w + x;
  const prev = new Map(); prev.set(key(from.x, from.y), null);
  const q = [[from.x, from.y]];
  const isGoal = (x, y) => Math.abs(x - to.x) + Math.abs(y - to.y) <= (blockedAt(m, to.x, to.y, ctx) ? 1 : 0);
  while (q.length) {
    const [x, y] = q.shift();
    if (isGoal(x, y)) {
      const path = []; let k = key(x, y);
      while (k !== null) { path.unshift({ x: k % w, y: Math.floor(k / w) }); k = prev.get(k); }
      return path.length - 1 <= (maxLen || 99) ? path : null;
    }
    for (const d of Object.values(DIRS)) {
      const nx = x + d[0], ny = y + d[1], k = key(nx, ny);
      if (nx < 0 || ny < 0 || nx >= w || ny >= h || prev.has(k)) continue;
      if (blockedAt(m, nx, ny, ctx)) continue;
      prev.set(k, key(x, y)); q.push([nx, ny]);
    }
  }
  return null;
}

// ---- src/core/quests.js ----
// ===== Quests =====
function questIds() {
  return Object.keys(DATA.quests).sort((a, b) => DATA.quests[a].day - DATA.quests[b].day || (a < b ? -1 : 1));
}
function stepDone(st, flags) { return !!flags[st.flag]; }
function questComplete(q, flags) {
  return !q.teilweise && q.steps.every(st => stepDone(st, flags));
}
// Prüft offene Quests; gibt neu abgeschlossene IDs zurück und trägt Fragmente ein
function updateQuests(save, day) {
  const neu = [];
  questIds().forEach(id => {
    const q = DATA.quests[id];
    if (q.day > day || save.done.indexOf(id) >= 0) return;
    if (questComplete(q, save.flags)) {
      save.done.push(id);
      if (save.fragments.indexOf(id) < 0) save.fragments.push(id);
      neu.push(id);
    }
  });
  return neu;
}
function allSecretIds() {
  const ids = [];
  Object.keys(DATA.maps).forEach(mid => (DATA.maps[mid].secrets || []).forEach(s => { if (s.count !== false) ids.push(s.id); }));
  return ids;
}

// ===== Datenprüfung (läuft beim Bauen und in den Tests) =====
function validateData() {
  const errors = [], warnings = [];
  const E = m => errors.push(m), Wn = m => warnings.push(m);
  const maps = DATA.maps, dlg = DATA.dialogs, chars = DATA.characters;
  const setFlags = new Set();

  function checkDialogRef(id, where) {
    const ids = Array.isArray(id) ? id : [id];
    ids.forEach(d => { if (!dlg[d]) E(where + ': Dialog „' + d + '“ fehlt'); });
  }
  function checkConds(list, where) {
    (list || []).forEach(c => { if (!COND_RE.test(c)) E(where + ': unbekannte Bedingung „' + c + '“'); });
  }
  function checkAction(a, where) {
    if (!a) return;
    checkConds(a.if, where);
    if (a.dialog) checkDialogRef(a.dialog, where);
    (a.set || []).forEach(f => setFlags.add(f));
    if (a.join && !chars[a.join]) E(where + ': Begleiter „' + a.join + '“ unbekannt');
    if (a.leave && !chars[a.leave]) E(where + ': Begleiter „' + a.leave + '“ unbekannt');
  }
  const checkTalk = (list, where) => (list || []).forEach((t, i) => checkAction(t, where + '[' + i + ']'));

  // Dialoge: Sprecher müssen existieren, Zeilen nicht zu lang
  Object.keys(dlg).forEach(id => {
    if (!Array.isArray(dlg[id]) || !dlg[id].length) return E('Dialog ' + id + ' ist leer');
    dlg[id].forEach(([sp, tx], i) => {
      if (sp && !chars[sp]) E('Dialog ' + id + '[' + i + ']: Sprecher „' + sp + '“ unbekannt');
      if (typeof tx !== 'string' || !tx) E('Dialog ' + id + '[' + i + ']: Text fehlt');
      else if (tx.length > 190) Wn('Dialog ' + id + '[' + i + '] ist sehr lang (' + tx.length + ' Zeichen)');
    });
  });
  Object.keys(chars).forEach(c => checkTalk(chars[c].talk, 'Figur ' + c));

  // Musik: jede Note muss lesbar sein (z. B. A#4:2, Pause -:6)
  Object.keys(DATA.musik).forEach(id => (DATA.musik[id].voices || []).forEach((vc, i) => vc.notes.trim().split(/\s+/).forEach(tok => {
    if (!/^([A-G][#b]?[0-8]|-):\d+(\.\d+)?$/.test(tok)) E('Musik ' + id + ' Stimme ' + i + ': unlesbare Note „' + tok + '“');
  })));

  // Karten
  if (!maps[DATA.welt.start.map]) E('Startkarte fehlt');
  Object.keys(maps).forEach(mid => {
    const m = maps[mid], w = m.tiles[0].length, where = 'Karte ' + mid;
    m.tiles.forEach((row, y) => {
      if (row.length !== w) E(where + ': Zeile ' + y + ' hat falsche Länge');
      for (const ch of row) if (!DATA.tiles[ch]) E(where + ': unbekannte Kachel „' + ch + '“ in Zeile ' + y);
    });
    const inB = (x, y) => x >= 0 && y >= 0 && x < w && y < m.tiles.length;
    if (m.music && !DATA.musik[m.music]) E(where + ': Musik „' + m.music + '“ fehlt');
    (m.objects || []).forEach((o, i) => {
      const t = DATA.objects[o.type];
      if (!t) return E(where + ': Objekt-Typ „' + o.type + '“ fehlt');
      if (!inB(o.x, o.y) || !inB(o.x + t.w - 1, o.y + t.h - 1)) E(where + ': Objekt ' + o.type + ' liegt außerhalb');
      checkConds(o.if, where + ' Objekt ' + i); checkTalk(o.talk, where + ' Objekt ' + o.type);
    });
    (m.npcs || []).forEach(n => {
      if (!chars[n.char]) E(where + ': NPC-Figur „' + n.char + '“ fehlt');
      if (!inB(n.x, n.y)) E(where + ': NPC ' + n.char + ' außerhalb');
      checkConds(n.if, where + ' NPC ' + n.char); checkTalk(n.talk, where + ' NPC ' + n.char);
    });
    (m.spots || []).forEach((s, i) => { if (!inB(s.x, s.y)) E(where + ': Stelle ' + i + ' außerhalb'); checkConds(s.if, where); checkTalk(s.talk, where + ' Stelle ' + i); });
    (m.secrets || []).forEach(s => {
      if (!s.id) E(where + ': Geheimnis ohne id');
      if (!inB(s.x, s.y)) E(where + ': Geheimnis ' + s.id + ' außerhalb');
      checkConds(s.if, where + ' Geheimnis ' + s.id); checkAction(s.found, where + ' Geheimnis ' + s.id);
    });
    (m.doors || []).forEach((d, i) => {
      const t = maps[d.to];
      if (!t) return E(where + ': Tür ' + i + ' führt zu fehlender Karte „' + d.to + '“');
      if (!inB(d.x, d.y)) E(where + ': Tür ' + i + ' außerhalb');
      if (tileSolid(t, d.tx, d.ty)) E(where + ': Tür ' + i + ' endet in einer Wand von ' + d.to);
      if (doorAt(t, d.tx, d.ty)) E(where + ': Tür ' + i + ' endet direkt auf einer Tür');
    });
  });

  // Erreichbarkeit: vom Start über Türen alle Karten, Figuren und Objekte
  const ctx = { flags: {}, day: 24, done: [], followers: Object.keys(chars) };
  const seen = {}; Object.keys(maps).forEach(k => { seen[k] = new Set(); });
  const queue = [[DATA.welt.start.map, DATA.welt.start.x, DATA.welt.start.y]];
  while (queue.length) {
    const [mid, x, y] = queue.pop(), m = maps[mid];
    if (!m || seen[mid].has(x + ',' + y)) continue;
    seen[mid].add(x + ',' + y);
    const d = doorAt(m, x, y);
    if (d && maps[d.to]) { queue.push([d.to, d.tx, d.ty]); continue; }
    Object.values(DIRS).forEach(([dx, dy]) => {
      const nx = x + dx, ny = y + dy;
      if (!blockedAt(m, nx, ny, ctx) && !seen[mid].has(nx + ',' + ny)) queue.push([mid, nx, ny]);
    });
  }
  const nearReach = (mid, cells) => cells.some(([x, y]) => Object.values(DIRS).some(([dx, dy]) => seen[mid].has((x + dx) + ',' + (y + dy))) || seen[mid].has(x + ',' + y));
  Object.keys(maps).forEach(mid => {
    const m = maps[mid];
    if (!seen[mid].size) return E('Karte ' + mid + ' ist nicht erreichbar');
    (m.doors || []).forEach((d, i) => { if (!seen[mid].has(d.x + ',' + d.y)) E('Karte ' + mid + ': Tür ' + i + ' ist nicht erreichbar'); });
    (m.npcs || []).forEach(n => { if (!nearReach(mid, [[n.x, n.y]])) E('Karte ' + mid + ': ' + n.char + ' ist nicht erreichbar'); });
    (m.secrets || []).forEach(s => { if (!nearReach(mid, [[s.x, s.y]])) E('Karte ' + mid + ': Geheimnis ' + s.id + ' ist nicht erreichbar'); });
    (m.objects || []).forEach(o => {
      if (!o.talk) return;
      const t = DATA.objects[o.type], cells = [];
      for (let yy = 0; yy < t.h; yy++) for (let xx = 0; xx < t.w; xx++) cells.push([o.x + xx, o.y + yy]);
      if (!nearReach(mid, cells)) E('Karte ' + mid + ': Objekt ' + o.type + ' ist nicht erreichbar');
    });
  });

  // Quests: jeder Schritt muss irgendwo gesetzt werden können
  const days = {};
  Object.keys(DATA.quests).forEach(id => {
    const q = DATA.quests[id];
    if (!(q.day >= 1 && q.day <= 24)) E('Quest ' + id + ': Tag ungültig');
    if (days[q.day]) E('Quest ' + id + ': Tag ' + q.day + ' doppelt'); days[q.day] = id;
    if (!q.title || !Array.isArray(q.steps) || !q.steps.length) E('Quest ' + id + ': Titel oder Schritte fehlen');
    if (q.start) checkDialogRef(q.start, 'Quest ' + id);
    (q.steps || []).forEach((st, i) => {
      if (!setFlags.has(st.flag)) {
        if (q.teilweise) Wn('Quest ' + id + ' Schritt ' + (i + 1) + ' (' + st.flag + ') ist noch nicht baubar – Quest als „teilweise“ markiert');
        else E('Quest ' + id + ' Schritt ' + (i + 1) + ': Flag „' + st.flag + '“ wird nirgends gesetzt – nicht abschließbar');
      }
    });
    if (q.teilweise) Wn('Quest ' + id + ' ist noch nicht vollständig gebaut');
  });
  return { errors, warnings };
}

// ===== Pixel-Werkzeuge: alle Grafiken werden im Code gemalt =====
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function srand(seed) { let s = (seed | 0) % 2147483647; if (s <= 0) s += 2147483646; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }

function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgbHex(r, g, b) { return '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join(''); }
// Farbe aufhellen (amt > 0) oder abdunkeln (amt < 0)
function shade(h, amt) {
  const [r, g, b] = hexRgb(h);
  return amt >= 0 ? rgbHex(r + (255 - r) * amt, g + (255 - g) * amt, b + (255 - b) * amt) : rgbHex(r * (1 + amt), g * (1 + amt), b * (1 + amt));
}

// Mal-Pinsel für einen Canvas-Kontext
function Pen(g) {
  return {
    g,
    r(x, y, w, h, c) { if (w <= 0 || h <= 0) return; g.fillStyle = c; g.fillRect(x | 0, y | 0, w | 0, h | 0); },
    px(x, y, c) { g.fillStyle = c; g.fillRect(x | 0, y | 0, 1, 1); },
    ell(cx, cy, rx, ry, c) {
      g.fillStyle = c;
      for (let y = -ry; y <= ry; y++) {
        const w = Math.round(rx * Math.sqrt(Math.max(0, 1 - (y * y) / ((ry + 0.4) * (ry + 0.4)))));
        if (w > 0) g.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2, 1);
      }
    },
    circ(cx, cy, rad, c) { this.ell(cx, cy, rad, rad, c); },
    // Senkrechter Farbverlauf in Stufen (Pixel-Look)
    vgrad(x, y, w, h, c1, c2, steps) {
      steps = steps || 4;
      const [a, b, d] = hexRgb(c1), [e, f, k] = hexRgb(c2);
      for (let i = 0; i < steps; i++) {
        const t = i / (steps - 1 || 1), y0 = y + Math.round(h * i / steps), y1 = y + Math.round(h * (i + 1) / steps);
        this.r(x, y0, w, y1 - y0, rgbHex(a + (e - a) * t, b + (f - b) * t, d + (k - d) * t));
      }
    },
    // Linie (Bresenham)
    line(x0, y0, x1, y1, c) {
      g.fillStyle = c; x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0;
      const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
      let err = dx + dy;
      for (;;) { g.fillRect(x0, y0, 1, 1); if (x0 === x1 && y0 === y1) break; const e2 = 2 * err; if (e2 >= dy) { err += dy; x0 += sx; } if (e2 <= dx) { err += dx; y0 += sy; } }
    },
  };
}

// Dunkle Kontur um alle sichtbaren Pixel (bessere Lesbarkeit der Figuren)
function outline(c, col) {
  const g = c.getContext('2d'), w = c.width, h = c.height, d = g.getImageData(0, 0, w, h).data, add = [];
  const op = (x, y) => x >= 0 && y >= 0 && x < w && y < h && d[(y * w + x) * 4 + 3] > 40;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++)
    if (!op(x, y) && (op(x - 1, y) || op(x + 1, y) || op(x, y - 1) || op(x, y + 1))) add.push(x, y);
  g.fillStyle = col;
  for (let i = 0; i < add.length; i += 2) g.fillRect(add[i], add[i + 1], 1, 1);
}

// ===== Kacheln (32×32) =====
// nb: Nachbarzeichen { up, down, left, right } und Kachelposition { x, y }
const isWallCh = ch => ch === 'W' || ch === 'D' || ch === 'X';

function planks(p, R, nb, cols) {
  for (let r = 0; r < 4; r++) {
    const y = r * 8, base = cols[(R() * cols.length) | 0];
    p.r(0, y, 32, 8, base);
    p.r(0, y, 32, 1, shade(base, 0.12));
    p.r(0, y + 7, 32, 1, shade(base, -0.38));
    const seam = (nb.x * 13 + nb.y * 7 + r * 11) % 32;
    p.r(seam, y, 1, 7, shade(base, -0.38));
    p.px(seam + 1, y + 1, shade(base, 0.15));
    for (let i = 0; i < 3; i++) p.r((R() * 28) | 0, y + 2 + ((R() * 4) | 0), 2 + ((R() * 4) | 0), 1, shade(base, -0.12));
    if (R() < 0.25) { const kx = (R() * 28) | 0; p.r(kx, y + 3, 2, 2, shade(base, -0.3)); }
  }
}

const PAINT_TILE = {
  decke(p, R, nb) {
    p.r(0, 0, 32, 32, '#1d130e');
    for (let i = 0; i < 6; i++) p.r((R() * 30) | 0, (R() * 30) | 0, 2, 1, '#261a12');
    const trim = (ch) => ch && ch !== 'T';
    if (trim(nb.down)) { p.r(0, 27, 32, 5, '#4a2c18'); p.r(0, 27, 32, 1, '#7a4c2c'); p.r(0, 31, 32, 1, '#24160c'); }
    if (trim(nb.up)) { p.r(0, 0, 32, 4, '#3a2214'); p.r(0, 0, 32, 1, '#6a4428'); }
    if (trim(nb.right)) { p.r(28, 0, 4, 32, '#3a2214'); p.r(28, 0, 1, 32, '#24160c'); p.r(31, 0, 1, 32, '#5a3820'); }
    if (trim(nb.left)) { p.r(0, 0, 4, 32, '#3a2214'); p.r(3, 0, 1, 32, '#24160c'); p.r(0, 0, 1, 32, '#5a3820'); }
  },
  wand_putz(p, R, nb) {
    const lower = !isWallCh(nb.down), top = nb.up === 'T';
    // Putz, warmes Creme
    p.r(0, 0, 32, 32, '#d2b083');
    for (let i = 0; i < 14; i++) p.px((R() * 32) | 0, (R() * 32) | 0, R() < 0.5 ? '#c4a174' : '#dcbd92');
    if (top) { p.r(0, 0, 32, 7, '#4a2c18'); p.r(0, 6, 32, 1, '#2e1a0e'); p.r(0, 1, 32, 1, '#6e4428'); p.r(0, 7, 32, 2, '#b8956a'); }
    if (lower) {
      // Holzvertäfelung mit Feldern
      p.r(0, 11, 32, 21, '#7a4a2a');
      p.r(0, 11, 32, 2, '#5a341c'); p.r(0, 11, 32, 1, '#9a6a42');
      p.r(3, 15, 26, 12, '#6c4024'); p.r(3, 15, 26, 1, '#4e2e18'); p.r(3, 26, 26, 1, '#94643c'); p.r(28, 15, 1, 12, '#94643c'); p.r(3, 15, 1, 12, '#4e2e18');
      p.r(0, 28, 32, 4, '#3e2414'); p.r(0, 28, 32, 1, '#6a4428');
    }
  },
  dielen(p, R, nb) { planks(p, R, nb, ['#94603a', '#8c5a35', '#9a663d', '#905d37']); },
  galerie(p, R, nb) { planks(p, R, nb, ['#a2703f', '#9a6a3c', '#a87543']); },
  galerie_front(p, R, nb) {
    planks(p, R, nb, ['#a2703f', '#9a6a3c']);
    p.r(0, 13, 32, 19, '#5c361e');
    p.r(0, 13, 32, 2, '#8a5a34'); p.r(0, 15, 32, 1, '#3e2414');
    for (let x = 2; x < 32; x += 16) { p.r(x, 18, 12, 10, '#4e2c18'); p.r(x, 18, 12, 1, '#3a2010'); p.r(x, 27, 12, 1, '#74482a'); p.r(x + 11, 18, 1, 10, '#74482a'); }
    p.r(0, 30, 32, 2, '#2e1a0e');
    // Geländer
    for (let x = 1; x < 32; x += 6) { p.r(x, 2, 2, 11, '#6e4226'); p.px(x, 2, '#9a6a42'); }
    p.r(0, 0, 32, 3, '#7a4a2a'); p.r(0, 0, 32, 1, '#b07a48');
  },
  galerie_seite(p, R, nb) {
    planks(p, R, nb, ['#94603a', '#8c5a35', '#9a663d']);
    p.r(0, 0, 11, 32, '#5c361e'); p.r(9, 0, 2, 32, '#3a2010'); p.r(0, 0, 2, 32, '#7a4a2a');
    for (let y = 3; y < 32; y += 10) { p.r(3, y, 5, 6, '#4e2c18'); p.r(3, y, 5, 1, '#74482a'); }
    p.r(11, 0, 5, 32, 'rgba(0,0,0,0.22)');
  },
  treppe(p) {
    for (let i = 0; i < 4; i++) {
      const y = i * 8, t = shade('#a06a40', -i * 0.06);

  wand_stein(p, R, nb) {
    p.r(0, 0, 32, 32, '#3a3340');

      const y = row * 8, off = (row + nb.y) % 2 ? 8 : 0;
      for (let x = -off; x < 32; x += 16) {
        const c = ['#6e6472', '#675d6b', '#746a78'][(R() * 3) | 0];
        p.r(x + 1, y + 1, 14, 6, c); p.r(x + 1, y + 1, 14, 1, shade(c, 0.15)); p.r(x + 1, y + 6, 14, 1, shade(c, -0.2));

    if (nb.up === 'T') { p.r(0, 0, 32, 4, '#2a2430'); }
    if (!isWallCh(nb.down)) { p.r(0, 26, 32, 6, '#2e2834'); p.r(0, 26, 32, 1, '#4e4652'); }
  },
  steinboden(p, R, nb) {
    p.r(0, 0, 32, 32, '#3a3440');
    for (let i = 0; i < 4; i++) {

      p.r(x + 1, y + 1, 14, 14, c); p.r(x + 1, y + 1, 14, 1, shade(c, 0.14)); p.r(x + 1, y + 1, 1, 14, shade(c, 0.08));

  ausgang_unten(p, R, nb) {

    for (let y = 16; y < 32; y += 2) p.r(0, y, 32, 2, 'rgba(10,6,12,' + ((y - 14) / 22).toFixed(2) + ')');
  },
};

// ---- src/engine/paint_objects.js ----
// ===== Objekte und Möbel =====
// Aufruf: PAINT_OBJ[name](p, f, R, W, H) – Leinwand W×H, Grundfläche liegt unten (H - h*32 ist der Überstand nach oben)

function flame(p, x, y, f, big) {
  const h = (big ? 7 : 5) + [0, 1, -1, 1][f % 4];
  const sway = [0, 1, 0, -1][f % 4];
  p.r(x - 1, y - h + 2, 3, h - 1, '#ff9a2a');
  p.r(x - 1 + sway, y - h, 2, 3, '#ffd36a');
  p.r(x, y - h + 3, 1, h - 3, '#fff2b0');
}
function bookRow(p, R, x0, x1, yBase, hMax) {
  const cols = ['#8a2a2a', '#2a4a8a', '#3a6a3a', '#8a6a2a', '#5a2a6a', '#2a6a6a', '#a0522d', '#d0b080', '#6a1e1e', '#e09a2c'];
  let x = x0;
  while (x < x1 - 2) {
    const w = 2 + ((R() * 3) | 0), h = hMax - ((R() * 5) | 0), c = cols[(R() * cols.length) | 0];
    if (x + w > x1) break;
    if (R() < 0.08 && x + 6 < x1) { // schräg liegendes Buch
      for (let i = 0; i < 5; i++) p.r(x + i, yBase - 3 - i, 3, 3, c);
      x += 7; continue;
    }
    p.r(x, yBase - h, w, h, c); p.r(x, yBase - h, 1, h, shade(c, 0.2)); p.r(x + w - 1, yBase - h, 1, h, shade(c, -0.3));
    if (R() < 0.5) p.r(x, yBase - h + 2, w, 1, '#e8c050');
    x += w + (R() < 0.15 ? 1 : 0);
  }
}

    p.r(32, 64, 30, 5, '#5a3218'); p.r(32, 64, 30, 1, '#7a4a28'); p.r(38, 60, 22, 5, '#4a2812'); p.r(38, 60, 22, 1, '#6a3e20');

function drawHuman(L, dir, fr) {
  const c = mkCanvas(32, 40), p = Pen(c.getContext('2d'));

  }

  const top = 20;

    p.r(x0, y, w, 1, L.robe); p.r(x0, y, 2, 1, L.robeD); p.r(x0 + w - 2, y, 2, 1, L.robeD);

  // Arme

  if (!side) {

    p.r(6, 22 + sw, 1, 10, L.robeL); p.r(25, 22 - sw, 1, 10, L.robeL);

  } else {
    p.r(14 + step, 23, 4, 10, L.robeD); p.r(14 + step, 23, 1, 10, L.robeL); p.r(14 + step, 33, 4, 2, L.skin);
  }
  // Schal in Hausfarben

  if (dir === 'down') { p.r(18, 22, 3, 6, L.trim); p.r(18, 24, 3, 1, L.robeD); }
  if (dir === 'right') { p.r(12, 22, 3, 5, L.trim); }
  if (dir === 'left') { p.r(17, 22, 3, 5, L.trim); }
  // Lange Haare hinter dem Kopf

    else { const bx = dir === 'right' ? 8 : 18; p.r(bx, 9, 6, 14, L.hairD); p.r(bx + 1, 9, 4, 13, L.hair); }
  }
  // Kopf
  const hx = side ? (dir === 'right' ? 17 : 15) : 16;
  p.ell(hx, 12, 7, 7, L.skin);
  p.r(hx - 6, 15, 12, 3, L.skin);
  if (dir === 'up') {
    p.ell(16, 11, 8, 8, L.hair); p.r(9, 12, 14, 7, L.hair);
    if (L.long) { p.r(9, 14, 14, 9, L.hair); p.r(10, 21, 12, 2, L.hairD); }
    for (let x = 10; x < 23; x += 3) p.r(x, 6, 1, 12, L.hairD);
    p.r(12, 4, 5, 2, L.hairL);
  } else if (dir === 'down') {
    p.ell(16, 8, 8, 5, L.hair); p.r(8, 7, 16, 4, L.hair);
    p.r(8, 9, 3, 6, L.hair); p.r(21, 9, 3, 6, L.hair);
    if (L.messy) { p.r(12, 2, 2, 2, L.hair); p.r(18, 3, 2, 2, L.hair); p.r(9, 11, 2, 2, L.hair); }
    p.r(11, 10, 10, 1, L.hairD); p.r(12, 4, 6, 2, L.hairL);
    if (L.curls) for (let x = 8; x < 25; x += 3) p.r(x, 11 + (x % 2), 2, 2, L.hairD);

    p.px(13, 14, L.eye); p.px(19, 14, L.eye);
    p.r(10, 16, 2, 1, '#f0a090'); p.r(20, 16, 2, 1, '#f0a090');
    p.r(15, 17, 3, 1, '#b86a5a');

      p.r(15, 13, 2, 1, g); p.px(11, 13, 'rgba(255,255,255,0.6)'); p.px(18, 13, 'rgba(255,255,255,0.6)');

    p.ell(15, 8, 8, 5, L.hair); p.r(8, 7, 13, 6, L.hair); p.r(8, 10, 6, 7, L.hair);
    if (L.messy) { p.r(12, 2, 2, 2, L.hair); p.r(17, 3, 2, 2, L.hair); }

  }

    const m = mkCanvas(32, 40), g = m.getContext('2d'); g.translate(32, 0); g.scale(-1, 1); g.drawImage(c, 0, 0);
    outline(m, '#24160f'); return m;
  }

  return c;
}

const DOG = { base: '#e3bd78', light: '#f4dcaa', shadeC: '#c49a58', patch: '#3e2a1c', patchL: '#5a4030', nose: '#1a1210' };

// ===== Musik und Töne per Web Audio (alles selbst erzeugt) =====
const NOTE_RE = /^([A-G])([#b]?)(\d)$/;
function noteFreq(n) {
  const m = NOTE_RE.exec(n); if (!m) return 0;
  const base = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 }[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  return 440 * Math.pow(2, (base + (parseInt(m[3], 10) - 4) * 12) / 12);
}
function parseVoice(str) {
  const ev = []; let t = 0;
  str.trim().split(/\s+/).forEach(tok => {
    const [n, d] = tok.split(':'); const dur = parseFloat(d) || 1;
    if (n !== '-') ev.push({ t, dur, f: noteFreq(n) });
    t += dur;
  });
  return { ev, len: t };
}

const AU = {
  ctx: null, master: null, music: null, sfxBus: null, on: true, cur: null, timer: null, noise: null, failed: false,
  init() {
    try { this.on = localStorage.getItem(SOUND_KEY) !== 'aus'; } catch (e) {}
  },
  unlock() {
    if (this.failed) return;
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) { this.failed = true; return; }
        const c = this.ctx = new AC();
        this.master = c.createGain(); this.master.gain.value = this.on ? 0.8 : 0; this.master.connect(c.destination);
        this.music = c.createGain(); this.music.gain.value = 0.32; this.music.connect(this.master);
        this.sfxBus = c.createGain(); this.sfxBus.gain.value = 0.5; this.sfxBus.connect(this.master);
        const nb = c.createBuffer(1, c.sampleRate, c.sampleRate), d = nb.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        this.noise = nb;
        const s = c.createBufferSource(); s.buffer = c.createBuffer(1, 1, 22050); s.connect(c.destination); s.start(0);
        if (this.want) this.playMusic(this.want, true);
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { this.failed = true; }
  },
  setOn(v) {
    this.on = v;
    try { localStorage.setItem(SOUND_KEY, v ? 'an' : 'aus'); } catch (e) {}
    if (this.master) this.master.gain.setTargetAtTime(v ? 0.8 : 0, this.ctx.currentTime, 0.05);
    if (v && this.want) this.playMusic(this.want, true);
  },
  suspend() { if (this.ctx && this.ctx.state === 'running') this.ctx.suspend(); },
  resume() { if (this.ctx && this.on) this.ctx.resume(); },

  // --- Instrumente ---
  tone(type, f, t, dur, vol, bus) {
    const c = this.ctx, g = c.createGain(); g.connect(bus || this.music);
    const o = c.createOscillator(); o.frequency.value = f; o.connect(g);
    if (type === 'spieluhr') {
      o.type = 'sine'; const o2 = c.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 4; const g2 = c.createGain(); g2.gain.value = 0.12; o2.connect(g2); g2.connect(g);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
      o2.start(t); o2.stop(t + 1.5); o.start(t); o.stop(t + 1.5);
    } else if (type === 'glocke') {
      o.type = 'sine'; const o2 = c.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 2.76; const g2 = c.createGain(); g2.gain.value = 0.25; o2.connect(g2); g2.connect(g);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.4);

      o.start(t); o.stop(t + dur);
    } else if (type === 'flaeche') {
      o.type = 'triangle'; const o2 = c.createOscillator(); o2.type = 'triangle'; o2.frequency.value = f * 1.5; o2.detune.value = 6; o2.connect(g);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol * 0.6, t + dur * 0.35); g.gain.linearRampToValueAtTime(0.0001, t + dur);
      o2.start(t); o2.stop(t + dur); o.start(t); o.stop(t + dur);
    } else {

      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  noiseBurst(t, dur, vol, freq, q) {

    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(this.sfxBus); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  },

  // --- Musik mit Vorausplanung ---
  playMusic(name, force) {
    this.want = name;

    if (!force && this.cur && this.cur.name === name) return;
    this.stopMusic();
    const song = DATA.musik[name]; if (!song) return;
    const eighth = 60 / song.bpm / 2;
    const voices = song.voices.map(v => Object.assign({ inst: v.inst, vol: v.vol || 0.4 }, parseVoice(v.notes)));
    const len = Math.max.apply(null, voices.map(v => v.len)) * eighth;
    this.cur = { name, voices, eighth, len, start: this.ctx.currentTime + 0.15, idx: voices.map(() => 0), loop: voices.map(() => 0) };

  tick() {

      case 'menue': this.tone('sine', 660, t, 0.08, 0.15, B); break;
      case 'zurueck': this.tone('sine', 440, t, 0.08, 0.12, B); break;
      case 'wuff': this.noiseBurst(t, 0.12, 0.5, 500, 2); this.tone('square', 210, t, 0.1, 0.08, B); this.noiseBurst(t + 0.18, 0.1, 0.4, 520, 2); this.tone('square', 190, t + 0.18, 0.08, 0.07, B); break;
      case 'schnueffeln': for (let i = 0; i < 4; i++) this.noiseBurst(t + i * 0.13, 0.07, 0.35, 2600, 1.5); break;
      case 'spur': [1046, 1318, 1568].forEach((f, i) => this.tone('spieluhr', f, t + i * 0.09, 0.4, 0.18, B)); break;
      case 'fund': [784, 988, 1175, 1568].forEach((f, i) => this.tone('glocke', f, t + i * 0.11, 1, 0.22, B)); break;
      case 'tuer': this.noiseBurst(t, 0.25, 0.4, 180, 1); this.tone('sine', 90, t, 0.25, 0.25, B); break;
      case 'piep': this.tone('sine', 1900, t, 0.06, 0.12, B); this.tone('sine', 2300, t + 0.1, 0.06, 0.12, B); break;
      case 'schnarch': this.noiseBurst(t, 0.8, 0.25, 300, 0.8); break;
      case 'tuerchen': [523, 659, 784, 1046, 1318].forEach((f, i) => this.tone('glocke', f, t + i * 0.12, 1.2, 0.2, B)); break;
      case 'stoss': this.tone('sine', 120, t, 0.06, 0.12, B); break;
    }
  },
};

// ---- src/engine/input.js ----
// ===== Eingabe: Steuerkreuz, A, B, Menü – Touch und Tastatur =====
const IN = {
  held: [], presses: [],
  press(k) {
    if (DIRS[k]) { if (this.held.indexOf(k) < 0) this.held.push(k); }
    this.presses.push(k);
  },
  release(k) { const i = this.held.indexOf(k); if (i >= 0) this.held.splice(i, 1); },
  dir() { return this.held.length ? this.held[this.held.length - 1] : null; },
  take(k) { const i = this.presses.indexOf(k); if (i >= 0) { this.presses.splice(i, 1); return true; } return false; },
  clear() { this.presses.length = 0; },

  init() {
    const KMAP = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right',
      Enter: 'a', ' ': 'a', z: 'a', y: 'a', x: 'b', Backspace: 'b', Escape: 'menu', m: 'menu' };
    addEventListener('keydown', e => {
      const k = KMAP[e.key]; if (!k) return;
      if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
      e.preventDefault(); if (!e.repeat) this.press(k);
    });
    addEventListener('keyup', e => { const k = KMAP[e.key]; if (k) this.release(k); });
    addEventListener('blur', () => { this.held.length = 0; });

    // Steuerkreuz: Richtung aus der Lage zum Mittelpunkt
    const dpad = document.getElementById('dpad'), arrows = {};
    dpad.querySelectorAll('.ar').forEach(el => { arrows[el.dataset.d] = el; });
    let padDir = null;
    const setPad = d => {
      if (d === padDir) return;
      if (padDir) { this.release(padDir); arrows[padDir].classList.remove('on'); }
      padDir = d;
      if (d) { this.press(d); arrows[d].classList.add('on'); }
    };
    const padPos = e => {
      const r = dpad.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
      if (Math.hypot(dx, dy) < r.width * 0.1) return setPad(null);
      setPad(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    };
    dpad.addEventListener('pointerdown', e => { e.preventDefault(); try { dpad.setPointerCapture(e.pointerId); } catch (_) {} padPos(e); });
    dpad.addEventListener('pointermove', e => { if (padDir || e.buttons) padPos(e); });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => dpad.addEventListener(n, () => setPad(null)));

    [['bA', 'a'], ['bB', 'b'], ['bMenu', 'menu']].forEach(([id, k]) => {
      const el = document.getElementById(id);
      el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); try { el.setPointerCapture(e.pointerId); } catch (_) {} this.press(k); el.classList.add('on'); });
      ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => el.addEventListener(n, () => { this.release(k); el.classList.remove('on'); }));
    });
    // Zoomen, Scrollen und Lupe auf dem iPad unterdrücken (außer im Code-Fenster)
    ['touchstart', 'touchmove', 'touchend', 'gesturestart', 'dblclick', 'contextmenu'].forEach(n => document.addEventListener(n, e => {
      if (e.target && e.target.closest && e.target.closest('#panel')) return;
      if (e.cancelable) e.preventDefault();
    }, { passive: false }));
  },
};

// ===== Darstellung: Karte, Figuren, Licht, Effekte =====
const R = {
  cv: null, ctx: null, S: 1, bgCache: {}, objCache: {}, light: null, lctx: null, cam: { x: 0, y: 0 }, parts: [],
  FONT: '"Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif',
  SERIF: 'Georgia, "Times New Roman", serif',

  init() {
    this.cv = document.getElementById('c'); this.ctx = this.cv.getContext('2d');
    this.light = mkCanvas(VIEW_W, VIEW_H); this.lctx = this.light.getContext('2d');
    addEventListener('resize', () => this.resize()); addEventListener('orientationchange', () => setTimeout(() => this.resize(), 200));
    this.resize();
  },
  // Ganzzahlige Skalierung in Geräte-Pixeln; Platz für Steuerung links/rechts (quer) oder unten (hoch)
  resize() {
    const dpr = window.devicePixelRatio || 1, vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;
    const land = vw >= vh;
    document.body.classList.toggle('hoch', !land);
    const aw = land ? vw - 2 * Math.min(200, Math.max(140, vw * 0.16)) : vw - 8;
    const ah = land ? vh - 16 : vh - 230;
    let S = Math.floor(Math.min(aw * dpr / VIEW_W, ah * dpr / VIEW_H));
    if (S < 1) S = 1;
    this.S = S;
    this.cv.width = VIEW_W * S; this.cv.height = VIEW_H * S;
    this.cv.style.width = (VIEW_W * S / dpr) + 'px'; this.cv.style.height = (VIEW_H * S / dpr) + 'px';
    this.ctx.imageSmoothingEnabled = false;
  },
  begin() { const c = this.ctx; c.setTransform(this.S, 0, 0, this.S, 0, 0); c.imageSmoothingEnabled = false; c.globalAlpha = 1; c.globalCompositeOperation = 'source-over'; },

  // --- Hintergrund einer Karte (Kacheln + Teppiche), einmal gemalt ---
  background(mid) {
    if (this.bgCache[mid]) return this.bgCache[mid];
    const m = DATA.maps[mid], w = mapW(m), h = mapH(m), c = mkCanvas(w * TILE, h * TILE), g = c.getContext('2d');
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const ch = m.tiles[y][x], t = DATA.tiles[ch], tc = mkCanvas(TILE, TILE);
      const nb = { up: tileChar(m, x, y - 1), down: tileChar(m, x, y + 1), left: tileChar(m, x - 1, y), right: tileChar(m, x + 1, y), x, y };
      (PAINT_TILE[t.paint] || PAINT_TILE.dielen)(Pen(tc.getContext('2d')), srand(x * 977 + y * 131 + 7), nb);
      g.drawImage(tc, x * TILE, y * TILE);
    }
    // weicher Schatten unter Wänden und Galerie
    for (let y = 1; y < h; y++) for (let x = 0; x < w; x++) {
      if (!DATA.tiles[m.tiles[y][x]].solid && DATA.tiles[m.tiles[y - 1][x]].solid) {
        for (let i = 0; i < 6; i++) { g.fillStyle = 'rgba(20,8,4,' + (0.32 - i * 0.05) + ')'; g.fillRect(x * TILE, y * TILE + i, TILE, 1); }
      }
    }
    (m.objects || []).forEach(o => { const t = objType(o); if (t.decal && !o.if) g.drawImage(this.objImg(o, 0), o.x * TILE, o.y * TILE - t.up); });
    return (this.bgCache[mid] = c);
  },
  objImg(o, f) {
    const t = objType(o), k = o.type + ':' + (o.seed || 0) + ':' + f;
    if (!this.objCache[k]) {
      const W = t.w * TILE, H = t.h * TILE + t.up, c = mkCanvas(W, H);
      PAINT_OBJ[t.paint](Pen(c.getContext('2d')), f, srand(31 + (o.seed || 1) * 101), W, H);
      this.objCache[k] = c;
    }
    return this.objCache[k];
  },
  objFrame(o, time) { const t = objType(o); return t.frames ? Math.floor(time * (t.fps || 4) + o.x * 0.7) % t.frames : 0; },

  camera(px, py, m) {
    const mw = mapW(m) * TILE, mh = mapH(m) * TILE;
    this.cam.x = mw <= VIEW_W ? -Math.round((VIEW_W - mw) / 2) : Math.round(clamp(px + 16 - VIEW_W / 2, 0, mw - VIEW_W));
    this.cam.y = mh <= VIEW_H ? -Math.round((VIEW_H - mh) / 2) : Math.round(clamp(py + 16 - VIEW_H / 2, 0, mh - VIEW_H));
  },

  // --- Welt zeichnen ---
  world(G, time) {
    const c = this.ctx, m = DATA.maps[G.mapId], ctx = G.ctx(), cam = this.cam;
    const pp = G.renderPos(G.player);
    this.camera(pp.x, pp.y, m);
    c.fillStyle = '#0c0810'; c.fillRect(0, 0, VIEW_W, VIEW_H);
    c.drawImage(this.background(G.mapId), -cam.x, -cam.y);
    const objs = visibleObjs(m, ctx);
    objs.forEach(o => { const t = objType(o); if (t.decal && o.if) c.drawImage(this.objImg(o, 0), o.x * TILE - cam.x, o.y * TILE - t.up - cam.y); });
    objs.forEach(o => { const t = objType(o); if (t.wall) c.drawImage(this.objImg(o, this.objFrame(o, time)), o.x * TILE - cam.x, o.y * TILE - t.up - cam.y); });
    this.paws(G, time);
    // Figuren und Möbel nach Tiefe sortiert
    const list = [];
    objs.forEach(o => { const t = objType(o); if (!t.wall && !t.decal) list.push({ y: (o.y + t.h) * TILE, d: () => c.drawImage(this.objImg(o, this.objFrame(o, time)), o.x * TILE - cam.x, o.y * TILE - t.up - cam.y) }); });
    visibleNpcs(m, ctx).forEach(n => list.push({ y: (n.y + 1) * TILE + 0.5, d: () => this.actor(n.char, n.x * TILE, n.y * TILE, n.dir, 0, n.pose, time) }));
    G.followers.forEach(f => { const p = G.renderPos(f); list.push({ y: p.y + TILE + 0.4, d: () => this.actor(f.char, p.x, p.y, f.dir, G.walkFrame(f), f.pose, time) }); });
    list.push({ y: pp.y + TILE + 0.6, d: () => this.actor('charly', pp.x, pp.y, G.player.dir, G.walkFrame(G.player), null, time) });
    list.sort((a, b) => a.y - b.y).forEach(e => e.d());
    this.particles(G, m, objs, time);
    this.lights(G, m, objs, pp, time);
  },
  actor(key, x, y, dir, fr, pose, time) {
    const c = this.ctx, cx = x - this.cam.x, cy = y - this.cam.y;
    c.fillStyle = 'rgba(20,8,4,0.28)';
    c.beginPath(); c.ellipse(cx + 16, cy + 29, key === 'diego' ? 11 : 9, 3, 0, 0, 6.283); c.fill();
    if (key === 'diego') {
      c.drawImage(SPR.get('diego', dir, fr, pose), cx, cy - 2);
      if (pose === 'schlaf') this.zzz(cx + 22, cy - 6, time);
    } else c.drawImage(SPR.get(key, dir, fr), cx, cy - 10);
  },
  zzz(x, y, time) {
    const c = this.ctx, k = (time * 0.8) % 1;
    c.globalAlpha = 1 - k; c.fillStyle = '#f4ead8'; c.font = '700 8px ' + this.FONT; c.fillText('z', x + k * 6, y - k * 10);
    c.globalAlpha = Math.max(0, 0.8 - k); c.font = '700 6px ' + this.FONT; c.fillText('z', x + 6 + k * 4, y - 8 - k * 8); c.globalAlpha = 1;
  },

  // Goldene Pfotenspur von Diegos Schnüffeln
  paws(G, time) {
    const tr = G.trail; if (!tr) return;
    const c = this.ctx, age = time - tr.t0, life = 7;
    if (age > life) { G.trail = null; return; }
    const fade = age > life - 1.5 ? (life - age) / 1.5 : 1;
    tr.pts.forEach((pt, i) => {
      const show = age - i * 0.09; if (show < 0 || i === 0) return;
      const a = Math.min(1, show * 3) * fade, side = i % 2 ? 5 : -5;
      const prev = tr.pts[i - 1], vert = prev.x === pt.x;
      const x = pt.x * TILE + 16 - this.cam.x + (vert ? side : 0), y = pt.y * TILE + 18 - this.cam.y + (vert ? 0 : side);
      c.globalAlpha = a * 0.35; c.fillStyle = '#ffd36a'; c.beginPath(); c.arc(x, y, 7, 0, 6.283); c.fill();
      c.globalAlpha = a; c.fillStyle = '#ffd36a';
      c.fillRect(x - 2, y - 1, 5, 4); c.fillRect(x - 3, y - 4, 2, 2); c.fillRect(x - 1, y - 5, 2, 2); c.fillRect(x + 1, y - 5, 2, 2); c.fillRect(x + 3, y - 4, 2, 2);
      c.fillStyle = '#fff6c8'; c.fillRect(x - 1, y, 2, 1);
    });
    if (tr.target && age > tr.pts.length * 0.09) {
      const x = tr.target.x * TILE + 16 - this.cam.x, y = tr.target.y * TILE + 14 - this.cam.y, s = 4 + Math.sin(time * 8) * 2;
      c.globalAlpha = fade; c.fillStyle = '#fff2b0';
      c.fillRect(x - s, y, s * 2 + 1, 1); c.fillRect(x, y - s, 1, s * 2 + 1); c.fillRect(x - 1, y - 1, 3, 3);
      c.globalAlpha = fade * 0.3; c.beginPath(); c.arc(x, y, 10, 0, 6.283); c.fill();
    }
    c.globalAlpha = 1;
  },

  particles(G, m, objs, time) {
    const c = this.ctx, kind = (m.ambient || {}).particles;
    if (kind === 'funken') objs.forEach(o => {
      if (o.type !== 'kamin' || Math.random() > 0.12) return;
      this.parts.push({ x: o.x * TILE + 36 + Math.random() * 24, y: o.y * TILE + 60, vx: (Math.random() - 0.5) * 8, vy: -18 - Math.random() * 14, life: 1.2 + Math.random(), t: 0, col: Math.random() < 0.5 ? '#ffd36a' : '#ff8a2a', mid: G.mapId });
    });
    if (kind === 'staub' && Math.random() < 0.06) this.parts.push({ x: this.cam.x + Math.random() * VIEW_W, y: this.cam.y + Math.random() * VIEW_H, vx: (Math.random() - 0.5) * 4, vy: -2 - Math.random() * 3, life: 4, t: 0, col: '#d8d0e8', mid: G.mapId, soft: 1 });
    const dt = 1 / 60;
    this.parts = this.parts.filter(p => (p.t += dt) < p.life && p.mid === G.mapId);
    this.parts.forEach(p => {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vx += (Math.random() - 0.5) * 2;
      c.globalAlpha = (1 - p.t / p.life) * (p.soft ? 0.5 : 1); c.fillStyle = p.col;
      c.fillRect(Math.round(p.x - this.cam.x), Math.round(p.y - this.cam.y), 1, 1);
    });
    c.globalAlpha = 1;
  },

  // Dunkelheit mit ausgesparten Lichtern, dazu warmes Leuchten
  lights(G, m, objs, pp, time) {
    const amb = m.ambient || {}, L = this.lctx, c = this.ctx;
    const srcs = [];
    objs.forEach(o => {
      const t = objType(o); if (!t.light) return;
      const fl = t.light.flicker ? 1 + Math.sin(time * 9 + o.x) * 0.04 + Math.sin(time * 23 + o.y) * 0.03 : 1;
      srcs.push({ x: o.x * TILE + t.light.x - this.cam.x, y: o.y * TILE - t.up + t.light.y - this.cam.y + t.up, r: t.light.r * fl, col: t.light.col });
    });
    srcs.push({ x: pp.x + 16 - this.cam.x, y: pp.y + 12 - this.cam.y, r: 70, col: '255,220,180', soft: true });
    L.globalCompositeOperation = 'source-over'; L.clearRect(0, 0, VIEW_W, VIEW_H);
    L.fillStyle = 'rgba(' + (amb.tint || '20,10,30') + ',' + (amb.dark || 0.4) + ')'; L.fillRect(0, 0, VIEW_W, VIEW_H);
    L.globalCompositeOperation = 'destination-out';
    srcs.forEach(s => {
      const g = L.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r);
      g.addColorStop(0, s.soft ? 'rgba(0,0,0,0.5)' : 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      L.fillStyle = g; L.fillRect(s.x - s.r, s.y - s.r, s.r * 2, s.r * 2);
    });
    c.drawImage(this.light, 0, 0);
    c.globalCompositeOperation = 'lighter';
    srcs.forEach(s => {
      if (s.soft) return;
      const g = c.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 0.8);
      g.addColorStop(0, 'rgba(' + s.col + ',0.16)'); g.addColorStop(1, 'rgba(' + s.col + ',0)');
      c.fillStyle = g; c.fillRect(s.x - s.r, s.y - s.r, s.r * 2, s.r * 2);
    });
    c.globalCompositeOperation = 'source-over';
  },

  // --- Text ---
  text(str, x, y, o) {
    o = o || {}; const c = this.ctx;
    c.font = (o.weight || 600) + ' ' + (o.size || 13) + 'px ' + (o.serif ? this.SERIF : this.FONT);
    c.textAlign = o.align || 'left'; c.textBaseline = 'alphabetic';
    if (o.shadow !== false) { c.fillStyle = o.shadowCol || 'rgba(0,0,0,0.6)'; c.fillText(str, x + 1, y + 1); }
    c.fillStyle = o.color || '#f4ead8'; c.fillText(str, x, y);
    c.textAlign = 'left';
  },
  wrap(str, maxW, size, weight) {
    const c = this.ctx; c.font = (weight || 500) + ' ' + size + 'px ' + this.FONT;
    const words = str.split(' '), lines = []; let cur = '';
    words.forEach(w => { const t = cur ? cur + ' ' + w : w; if (c.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; });
    if (cur) lines.push(cur);
    return lines;
  },
  panel(x, y, w, h, alpha) {
    const c = this.ctx;
    c.fillStyle = 'rgba(28,18,30,' + (alpha || 0.94) + ')'; c.fillRect(x, y, w, h);
    c.fillStyle = '#e09a2c'; c.fillRect(x, y, w, 2); c.fillRect(x, y + h - 2, w, 2); c.fillRect(x, y, 2, h); c.fillRect(x + w - 2, y, 2, h);
    c.fillStyle = '#4f6b2a'; c.fillRect(x + 3, y + 3, w - 6, 1); c.fillRect(x + 3, y + h - 4, w - 6, 1);
    c.fillStyle = '#ffd36a'; [[x, y], [x + w - 4, y], [x, y + h - 4], [x + w - 4, y + h - 4]].forEach(([a, b]) => c.fillRect(a, b, 4, 4));
  },
};

// ===== Dialogbox mit Schreibmaschinen-Effekt =====
const DLG = {
  pages: [], idx: 0, shown: 0, cb: null, blipAt: 0,
  get open() { return this.pages.length > 0; },
  // lines: [[sprecher, text], ...]; Sprecher '' = Erzähler
  show(lines, cb) {
    const pages = [];
    lines.forEach(([sp, tx]) => {
      const name = sp ? (DATA.characters[sp] || { name: sp }).name : '';
      const wrapped = R.wrap(tx, 470, 15, 500);
      for (let i = 0; i < wrapped.length; i += 3) pages.push({ name, sp, lines: wrapped.slice(i, i + 3) });
    });
    this.pages = pages; this.idx = 0; this.shown = 0; this.cb = cb || null;
  },
  pageLen() { return this.pages[this.idx].lines.join(' ').length; },
  update(dt) {
    if (!this.open) return;
    const before = Math.floor(this.shown);
    this.shown = Math.min(this.pageLen(), this.shown + dt * 55);
    if (Math.floor(this.shown) > before && Math.floor(this.shown) % 3 === 0) AU.sfx('blip');
    if (IN.take('a') || IN.take('b')) {
      if (this.shown < this.pageLen()) { this.shown = this.pageLen(); return; }
      this.idx++; this.shown = 0;
      if (this.idx >= this.pages.length) { const cb = this.cb; this.pages = []; this.cb = null; if (cb) cb(); }
    }
  },
  draw(time) {
    if (!this.open) return;
    const pg = this.pages[this.idx], c = R.ctx, x = 10, y = 286, w = VIEW_W - 20, h = 90;
    R.panel(x, y, w, h, 0.95);
    if (pg.name) {
      c.font = '700 13px ' + R.FONT; const nw = c.measureText(pg.name).width + 20;
      R.panel(x + 12, y - 18, nw, 22, 1); R.text(pg.name, x + 22, y - 2, { size: 13, weight: 700, color: '#ffd36a' });
    }
    let left = Math.floor(this.shown);
    pg.lines.forEach((ln, i) => {
      const part = ln.slice(0, Math.max(0, left)); left -= ln.length + 1;
      R.text(part, x + 16, y + 27 + i * 21, { size: 15, weight: 500, color: pg.name ? '#f8f0e0' : '#e8dcc4' });
    });
    if (this.shown >= this.pageLen() && Math.floor(time * 3) % 2) { c.fillStyle = '#ffd36a'; c.fillRect(x + w - 22, y + h - 16, 9, 3); c.fillRect(x + w - 20, y + h - 13, 5, 2); c.fillRect(x + w - 19, y + h - 11, 3, 2); }
  },
};

    c.globalAlpha = 1;

    let wi = 0;

      else for (let xx = x; xx < x + w; xx += 8) p.r(xx, top - 5, 5, 5, '#151228');
      for (let yy = top + 12; yy < 290; yy += 18) for (let xx = x + 6; xx < x + w - 6; xx += 14) {
        const k = this.windows[wi++ % this.windows.length]; if (k[0] < 0.45) continue;
        c.fillStyle = k[1] < 0.5 ? '#ffcf6a' : '#f0a040'; c.globalAlpha = 0.7 + 0.3 * Math.sin(time * 2 + k[2] * 20); c.fillRect(xx, yy, 3, 5);
      }

    const PC = { o: '#ff8a2a', y: '#ffd36a', Y: '#fff2b0', W: '#ffffff' }, flap = Math.sin(time * 3) > 0.6 ? 1 : 0;
    PHOENIX.forEach((row, y) => { for (let x = 0; x < row.length; x++) { const ch = row[x]; if (ch === '.') continue; const wing = ch === 'y' && (x < 8 || x > 14); c.fillStyle = PC[ch]; c.fillRect(bx + x * s, by + (y - (wing ? flap : 0)) * s, s, s); } });
    R.text('Die Reise zum', VIEW_W / 2, 112, { size: 18, serif: true, align: 'center', color: '#e8dcc4', weight: 400 });

      R.text((on ? '▸ ' : '') + o.label, VIEW_W / 2, y, { size: 16, align: 'center', color: on ? '#ffd36a' : '#f4ead8', weight: on ? 700 : 500 });

    R.text(info, VIEW_W / 2, 330, { size: 12, align: 'center', color: '#3a2a50', weight: 600, shadow: false });

  // --- Auswahlliste (Menü, Nachfragen) ---
  list(title, opts, time) {

  // Auf/Ab wählen, A bestätigen, B/Menü zurück. Gibt Index, -1 (zurück) oder null zurück
  navigate(n) {
    if (IN.take('up')) { this.sel = (this.sel + n - 1) % n; AU.sfx('menue'); }
    if (IN.take('down')) { this.sel = (this.sel + 1) % n; AU.sfx('menue'); }
    if (IN.take('a')) { AU.sfx('menue'); return this.sel; }

  // --- Questlog ---
  questlog(G) {

    R.text('Questlog', 34, 42, { size: 20, weight: 700, serif: true, color: '#ffd36a' });

      lines.push(['Bis dahin: Schau dich im Gemeinschaftsraum um, weck Diego', '#c8b898', 500]);

    });
    const total = allSecretIds().length, found = G.save.secrets.length;
    const maxRows = 12; this.scroll = clamp(this.scroll, 0, Math.max(0, lines.length - maxRows));

    c.fillStyle = 'rgba(224,154,44,0.4)'; c.fillRect(34, VIEW_H - 54, VIEW_W - 68, 1);
    R.text('🐾 Geheimnisse gefunden: ' + found + ' von ' + total + '      Fragmente: ' + G.save.fragments.length + ' von 24', 34, VIEW_H - 34, { size: 12, color: '#c8b898' });
  },
  lied(G) {
    R.panel(16, 14, VIEW_W - 32, VIEW_H - 28);
    R.text('Das Phönixlied', 34, 42, { size: 20, weight: 700, serif: true, color: '#ffd36a' });
    R.text(G.save.fragments.length + ' von 24 Zeilen', VIEW_W - 34, 40, { size: 12, align: 'right', color: '#c8b898' });
